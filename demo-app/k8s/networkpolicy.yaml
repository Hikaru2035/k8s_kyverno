apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-health-from-jenkins
  namespace: ksp-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: jenkins
      podSelector:
        matchLabels:
          app.kubernetes.io/name: jenkins-agent
    ports:
    - protocol: TCP
      port: 8080
  egress: []
