stages:
  - validate
  - unit
  - regression
  - integration
  - report


variables:
  FRAMEWORK_ROOT: "k8s-security-framework"
  MINIMUM_POLICY_SUITES: "30"
  KYVERNO_VERSION: "v1.18.2"
  KYVERNO_CHART_VERSION: "3.8.2"
  KIND_VERSION: "v0.32.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"

  # Cần history để xác định policy thay đổi trong MR/push.
  GIT_DEPTH: "0"


default:
  interruptible: true

  retry:
    max: 1
    when:
      - runner_system_failure


workflow:
  rules:
    # Merge Request pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Không tạo branch pipeline trùng nếu branch đã có MR.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

    # Push bình thường.
    - if: '$CI_COMMIT_BRANCH'

harbor_auth_check:
  stage: validate
  tags:
    - harbor-runner
  script:
    - test -n "$HARBOR_USERNAME"
    - test -n "$HARBOR_PASSWORD"
    - |
      AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
      STATUS="$(curl -sS \
        -o /dev/null \
        -w '%{http_code}' \
        -H "Authorization: Basic $AUTH" \
        https://harbor-public:30003/v2/)"
      echo "Harbor HTTP status: $STATUS"
      test "$STATUS" = "200"
      
validate:
  stage: validate

  image: python:3.12.11-slim-bookworm

  before_script:
    - python3 -m pip install --no-cache-dir PyYAML==6.0.2
    - mkdir -p "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/validate"

  script:

    # --------------------------------------------------------
    # 1. Policy/profile/environment configuration
    # --------------------------------------------------------
    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      set +e

      bash ./scripts/validate-policy-config.sh \
        > artifacts/validate/policy-config.txt 2>&1

      config_status=$?

      set -e

      cat artifacts/validate/policy-config.txt

      test "$config_status" -eq 0


    # --------------------------------------------------------
    # 2. Test coverage
    # --------------------------------------------------------
    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      suite_count="$(
        find policies \
          -type f \
          -path '*/tests/kyverno-test.yaml' \
          | wc -l \
          | tr -d ' '
      )"

      echo "Policy suites found: $suite_count"

      set +e

      EXPECTED_POLICY_COUNT="$suite_count" \
        bash ./tests/policies/check-coverage.sh \
        > artifacts/validate/test-coverage.txt 2>&1

      coverage_status=$?

      set -e

      cat artifacts/validate/test-coverage.txt

      test "$coverage_status" -eq 0


    # --------------------------------------------------------
    # 3. YAML + references
    #
    # Giữ logic từ pipeline validate đã chạy thành công.
    # --------------------------------------------------------
    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      set +e

      python3 - <<'PY' \
        > artifacts/validate/yaml-and-references.txt 2>&1

      from collections import Counter
      from pathlib import Path
      import os
      import sys
      import yaml


      root = Path.cwd()
      errors = []

      minimum = int(os.environ["MINIMUM_POLICY_SUITES"])


      scan_roots = [
          root / "policies",
          root / "tests",
          root / "ci",
          root / "e2e_env",
          root / "kyverno" / "helm",
          root / "profiles",
          root / "environments",
      ]


      yaml_files = []

      for scan_root in scan_roots:

          if scan_root.exists():

              candidates = (
                  list(scan_root.rglob("*.yaml"))
                  + list(scan_root.rglob("*.yml"))
              )

              yaml_files.extend(
                  path
                  for path in candidates
                  if "evidence" not in path.parts
                  and "reports" not in path.parts
              )


      gitlab_ci = root.parent / ".gitlab-ci.yml"

      if gitlab_ci.is_file():
          yaml_files.append(gitlab_ci)


      yaml_files = sorted(set(yaml_files))
      documents = {}


      for path in yaml_files:

          try:

              documents[path] = list(
                  yaml.safe_load_all(
                      path.read_text(encoding="utf-8")
                  )
              )

          except (
              OSError,
              UnicodeError,
              yaml.YAMLError,
          ) as exc:

              try:
                  location = path.relative_to(root.parent)
              except ValueError:
                  location = path

              errors.append(
                  f"invalid YAML {location}: {exc}"
              )


      policy_dirs = sorted(
          path
          for path in (root / "policies").glob("*/KSP-*")
          if path.is_dir()
      )


      policy_ids = [
          path.name
          for path in policy_dirs
      ]


      for policy_id, count in Counter(policy_ids).items():

          if count > 1:

              errors.append(
                  f"duplicate policy ID: {policy_id}"
              )


      policy_names = []
      manifests = []


      for policy_dir in policy_dirs:

          policy_id = policy_dir.name


          sources = sorted(
              policy_dir.glob(
                  f"{policy_id}-*.yaml"
              )
          )


          if len(sources) != 1:

              errors.append(
                  f"{policy_id}: expected one source policy, "
                  f"found {len(sources)}"
              )

          elif sources[0] in documents:

              for document in documents[sources[0]]:

                  if isinstance(document, dict):

                      name = (
                          document
                          .get("metadata", {})
                          .get("name")
                      )

                      if not name:

                          errors.append(
                              f"{policy_id}: "
                              "policy metadata.name is missing"
                          )

                      else:

                          policy_names.append(
                              (
                                  name,
                                  sources[0],
                              )
                          )


          manifest = (
              policy_dir
              / "tests"
              / "kyverno-test.yaml"
          )


          if not manifest.is_file():

              errors.append(
                  f"{policy_id}: "
                  "missing tests/kyverno-test.yaml"
              )

          else:

              manifests.append(manifest)


      for name, count in Counter(
          name
          for name, _ in policy_names
      ).items():

          if count > 1:

              locations = ", ".join(
                  str(path.relative_to(root))
                  for candidate, path
                  in policy_names
                  if candidate == name
              )

              errors.append(
                  "duplicate policy "
                  f"metadata.name '{name}': "
                  f"{locations}"
              )


      if len(manifests) < minimum:

          errors.append(
              "suite baseline violated: "
              f"expected at least {minimum}, "
              f"found {len(manifests)}"
          )


      if len(manifests) != len(policy_dirs):

          errors.append(
              "policy/test mismatch: "
              f"{len(policy_dirs)} policy directories, "
              f"{len(manifests)} suites"
          )


      list_reference_keys = (
          "policies",
          "resources",
          "exceptions",
          "targetResources",
      )


      scalar_reference_keys = (
          "context",
          "variables",
          "userinfo",
      )


      result_reference_keys = (
          "patchedResource",
          "generatedResource",
          "cloneSourceResource",
      )


      for manifest in manifests:

          loaded = documents.get(
              manifest,
              [],
          )


          test = (
              loaded[0]
              if loaded
              else None
          )


          if not isinstance(test, dict):

              errors.append(
                  f"{manifest.relative_to(root)}: "
                  "expected one Test document"
              )

              continue


          if test.get("kind") != "Test":

              errors.append(
                  f"{manifest.relative_to(root)}: "
                  "kind must be Test"
              )


          for key in list_reference_keys:

              references = test.get(
                  key,
                  [],
              )


              if references is None:
                  continue


              if not isinstance(
                  references,
                  list,
              ):

                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"{key} must be a list"
                  )

                  continue


              for reference in references:

                  if (
                      not isinstance(reference, str)
                      or not (
                          manifest.parent
                          / reference
                      ).is_file()
                  ):

                      errors.append(
                          f"{manifest.relative_to(root)}: "
                          f"missing {key} reference "
                          f"{reference!r}"
                      )


          for key in scalar_reference_keys:

              reference = test.get(key)


              if (
                  reference is not None
                  and (
                      not isinstance(reference, str)
                      or not (
                          manifest.parent
                          / reference
                      ).is_file()
                  )
              ):

                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"missing {key} reference "
                      f"{reference!r}"
                  )


          for index, result in enumerate(
              test.get("results", [])
          ):

              if not isinstance(result, dict):

                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"results[{index}] "
                      "must be a mapping"
                  )

                  continue


              for key in result_reference_keys:

                  reference = result.get(key)


                  if (
                      reference is not None
                      and (
                          not isinstance(reference, str)
                          or not (
                              manifest.parent
                              / reference
                          ).is_file()
                      )
                  ):

                      errors.append(
                          f"{manifest.relative_to(root)}: "
                          f"missing results[{index}]."
                          f"{key} reference "
                          f"{reference!r}"
                      )


      if errors:

          print(
              "Validation FAILED with "
              f"{len(errors)} error(s):"
          )

          for error in errors:
              print(f"ERROR: {error}")

          sys.exit(1)


      print(
          "Validation PASSED: "
          f"{len(yaml_files)} YAML files, "
          f"{len(policy_dirs)} policies, "
          f"{len(manifests)} suites."
      )

      PY

      validation_status=$?

      set -e

      cat artifacts/validate/yaml-and-references.txt

      exit "$validation_status"


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/validate/

check-policy:
  stage: validate

  image: python:3.12.11-slim-bookworm

  needs:
    - job: validate
      artifacts: false

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python3 -m pip install --no-cache-dir PyYAML==6.0.2
    - mkdir -p "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/check-policy"

  script:

    # --------------------------------------------------------
    # 1. Render all environments deterministically
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      python3 ./scripts/render-policies.py development \
        > artifacts/check-policy/render-development.txt \
        2>&1

      python3 ./scripts/render-policies.py staging \
        > artifacts/check-policy/render-staging.txt \
        2>&1

      python3 ./scripts/render-policies.py production \
        > artifacts/check-policy/render-production.txt \
        2>&1


      cat artifacts/check-policy/render-development.txt
      cat artifacts/check-policy/render-staging.txt
      cat artifacts/check-policy/render-production.txt


    # --------------------------------------------------------
    # 2. Check drift
    #
    # Nếu render lại tạo bất kỳ modified/new/deleted file nào:
    # FAIL.
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      git status --porcelain -- e2e_env \
        > artifacts/check-policy/render-drift.txt


      cat artifacts/check-policy/render-drift.txt


      if test -s artifacts/check-policy/render-drift.txt
      then

        echo "ERROR: rendered e2e_env policy bundle is stale."
        echo "Source of truth and deployable policies are not synchronized."

        exit 1

      fi


      echo "CHECK POLICY PASSED."
      echo "e2e_env is synchronized with policies/."


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/check-policy/

unit:
  stage: unit

  image: alpine:3.21.3

  needs:
    - job: check-policy
      artifacts: false

  before_script:
    - apk add --no-cache curl tar
    - |
      ARCH="$(uname -m)"

      case "$ARCH" in
        x86_64)
          KYVERNO_ARCH="x86_64"
          ;;
        aarch64|arm64)
          KYVERNO_ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture: $ARCH"
          exit 1
          ;;
      esac

      curl -fsSL \
        "https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_${KYVERNO_ARCH}.tar.gz" \
        -o /tmp/kyverno.tar.gz

      tar -xzf /tmp/kyverno.tar.gz -C /tmp
      mv /tmp/kyverno /usr/local/bin/kyverno
      chmod +x /usr/local/bin/kyverno

      kyverno version

    - mkdir -p "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/cli-unit/junit"

  script:

    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kyverno version \
        > artifacts/cli-unit/kyverno-version.txt \
        2>&1


      overall_status=0


      while IFS= read -r manifest
      do

        tests_dir="$(dirname "$manifest")"

        policy_id="$(
          basename "$(
            dirname "$tests_dir"
          )"
        )"


        echo "=================================================="
        echo "UNIT TEST: $policy_id"
        echo "=================================================="


        raw_report="artifacts/cli-unit/junit/${policy_id}.raw.txt"

        extracted_report="artifacts/cli-unit/junit/${policy_id}.extracted.xml"

        xml_report="artifacts/cli-unit/junit/${policy_id}.xml"


        set +e


        kyverno test "$tests_dir" \
          --remove-color \
          --detailed-results \
          --require-tests \
          > "artifacts/cli-unit/${policy_id}.txt" \
          2>&1


        text_status=$?


        kyverno test "$tests_dir" \
          --remove-color \
          --require-tests \
          --output-format junit \
          > "$raw_report" \
          2>&1


        junit_status=$?


        set -e


        cat "artifacts/cli-unit/${policy_id}.txt"


        sed -n \
          '/^<?xml /,/^<\/testsuites>$/p' \
          "$raw_report" \
          > "$extracted_report"


        sed \
          's#<failure message="\([^"]*\)">#<failure message="\1" />#' \
          "$extracted_report" \
          > "$xml_report"


        rm -f "$extracted_report"


        if test "$text_status" -ne 0 \
          || test "$junit_status" -ne 0 \
          || ! test -s "$xml_report"
        then

          overall_status=1

        fi


      done < <(
        find policies \
          -type f \
          -path '*/tests/kyverno-test.yaml' \
          | sort
      )


      exit "$overall_status"


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/cli-unit/

    reports:
      junit:
        k8s-security-framework/artifacts/cli-unit/junit/*.xml

rendered-policy-test:
  stage: unit

  image: alpine:3.21.3

  needs:
    - job: check-policy
      artifacts: false

  before_script:
    - apk add --no-cache curl tar
    - |
      ARCH="$(uname -m)"

      case "$ARCH" in
        x86_64)
          KYVERNO_ARCH="x86_64"
          ;;
        aarch64|arm64)
          KYVERNO_ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture: $ARCH"
          exit 1
          ;;
      esac

      curl -fsSL \
        "https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_${KYVERNO_ARCH}.tar.gz" \
        -o /tmp/kyverno.tar.gz

      tar -xzf /tmp/kyverno.tar.gz -C /tmp
      mv /tmp/kyverno /usr/local/bin/kyverno
      chmod +x /usr/local/bin/kyverno

      kyverno version

    - mkdir -p "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/cli-unit/junit"
  script:

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      TMP_ROOT="artifacts/rendered-policy-test/tmp-tests"


      rm -rf "$TMP_ROOT"

      mkdir -p "$TMP_ROOT"


      while IFS= read -r manifest
      do

        tests_dir="$(dirname "$manifest")"

        policy_dir="$(dirname "$tests_dir")"

        policy_id="$(basename "$policy_dir")"


        source_policy="$(
          find "$policy_dir" \
            -maxdepth 1 \
            -type f \
            -name "${policy_id}-*.yaml" \
            -print \
            -quit
        )"


        source_name="$(basename "$source_policy")"


        rendered_policy="$(
          find e2e_env/production/policies \
            -type f \
            -name "$source_name" \
            -print \
            -quit
        )"


        if test -z "$rendered_policy"
        then

          echo "ERROR: rendered production policy missing:"
          echo "$policy_id"

          exit 1

        fi


        tmp_policy_dir="$TMP_ROOT/$policy_id"


        mkdir -p "$tmp_policy_dir"


        cp "$rendered_policy" \
          "$tmp_policy_dir/$source_name"


        cp -R "$tests_dir" \
          "$tmp_policy_dir/tests"


        echo "$policy_id -> $rendered_policy"


      done < <(
        find policies \
          -type f \
          -path '*/tests/kyverno-test.yaml' \
          | sort
      )


      find "$TMP_ROOT" \
        -type f \
        | sort \
        > artifacts/rendered-policy-test/tmp-manifest.txt


      cat artifacts/rendered-policy-test/tmp-manifest.txt

    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      TMP_ROOT="artifacts/rendered-policy-test/tmp-tests"


      set +e


      kyverno test "$TMP_ROOT" \
        --remove-color \
        --detailed-results \
        --require-tests \
        > artifacts/rendered-policy-test/results.txt \
        2>&1


      rendered_test_status=$?


      set -e


      cat artifacts/rendered-policy-test/results.txt


      exit "$rendered_test_status"


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/rendered-policy-test/

regression:
  stage: regression

  image: alpine:3.21.3

  needs:
    - job: unit
      artifacts: false

    - job: rendered-policy-test
      artifacts: false

  before_script:
    - apk add --no-cache curl tar
    - |
      ARCH="$(uname -m)"

      case "$ARCH" in
        x86_64)
          KYVERNO_ARCH="x86_64"
          ;;
        aarch64|arm64)
          KYVERNO_ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture: $ARCH"
          exit 1
          ;;
      esac

      curl -fsSL \
        "https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_${KYVERNO_ARCH}.tar.gz" \
        -o /tmp/kyverno.tar.gz

      tar -xzf /tmp/kyverno.tar.gz -C /tmp
      mv /tmp/kyverno /usr/local/bin/kyverno
      chmod +x /usr/local/bin/kyverno

      kyverno version

    - mkdir -p "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/cli-unit/junit"

  script:

    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kyverno version \
        > artifacts/regression/kyverno-version.txt \
        2>&1


      set +e


      kyverno test policies \
        --remove-color \
        --detailed-results \
        --require-tests \
        > artifacts/regression/results.txt \
        2>&1


      regression_status=$?


      set -e


      cat artifacts/regression/results.txt


      exit "$regression_status"


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/regression/

kind-integration:
  stage: integration

  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command:
        - "--tls=false"

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

    KIND_CLUSTER_NAME: "ksp-ci"

  needs:
    - job: regression
      artifacts: false

  rules:

    - changes:
        - k8s-security-framework/policies/**/*
        - k8s-security-framework/profiles/**/*
        - k8s-security-framework/e2e_env/**/*
        - k8s-security-framework/tests/**/*
        - k8s-security-framework/scripts/**/*
        - .gitlab-ci.yml

    - when: never


  before_script:

    - apk add --no-cache bash curl ca-certificates tar gzip

    - |
      set -eu

      case "$(uname -m)" in

        x86_64)
          ARCH="amd64"
          ;;

        aarch64|arm64)
          ARCH="arm64"
          ;;

        *)
          echo "Unsupported architecture: $(uname -m)"
          exit 1
          ;;

      esac


      echo "$ARCH" > /tmp/ci-arch


    # --------------------------------------------------------
    # Install Kind
    # --------------------------------------------------------
    - |
      ARCH="$(cat /tmp/ci-arch)"


      curl -fsSLo /usr/local/bin/kind \
        "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${ARCH}"


      chmod +x /usr/local/bin/kind


      kind version


    # --------------------------------------------------------
    # Install kubectl
    # --------------------------------------------------------
    - |
      ARCH="$(cat /tmp/ci-arch)"


      KUBECTL_VERSION="$(
        curl -L -s \
          https://dl.k8s.io/release/stable.txt
      )"


      curl -fsSLo /usr/local/bin/kubectl \
        "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"


      chmod +x /usr/local/bin/kubectl


      kubectl version --client


    # --------------------------------------------------------
    # Install Helm
    # --------------------------------------------------------
    - |
      ARCH="$(cat /tmp/ci-arch)"


      HELM_VERSION="v3.21.4"


      curl -fsSLo /tmp/helm.tar.gz \
        "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz"


      tar -xzf /tmp/helm.tar.gz \
        -C /tmp


      mv "/tmp/linux-${ARCH}/helm" \
        /usr/local/bin/helm


      chmod +x /usr/local/bin/helm


      helm version


    - docker info


  script:

    # --------------------------------------------------------
    # 1. Artifact directory
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      mkdir -p artifacts/integration-kind


    # --------------------------------------------------------
    # 2. Create cluster
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kind create cluster \
        --name "$KIND_CLUSTER_NAME" \
        --wait 180s \
        2>&1 \
        | tee artifacts/integration-kind/kind-create.txt


      kubectl get nodes -o wide \
        | tee artifacts/integration-kind/nodes.txt


    # --------------------------------------------------------
    # 3. Install Kyverno
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      helm repo add kyverno \
        https://kyverno.github.io/kyverno/


      helm repo update


      helm install kyverno kyverno/kyverno \
        --namespace kyverno \
        --create-namespace \
        --version "$KYVERNO_CHART_VERSION" \
        --set admissionController.replicas=1 \
        --set backgroundController.replicas=1 \
        --set cleanupController.replicas=1 \
        --set reportsController.replicas=1 \
        --wait \
        --timeout 5m \
        2>&1 \
        | tee artifacts/integration-kind/kyverno-install.txt


      kubectl -n kyverno get pods -o wide \
        | tee artifacts/integration-kind/kyverno-pods.txt


      kubectl get validatingwebhookconfigurations \
        -o wide \
        > artifacts/integration-kind/webhooks.txt


    # --------------------------------------------------------
    # 4. Apply ALL rendered production policies
    #
    # Mục tiêu:
    # chứng minh deployable policies được API Server/Kyverno
    # accept.
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kubectl apply \
        --recursive \
        -f e2e_env/production/policies \
        2>&1 \
        | tee artifacts/integration-kind/all-policy-apply.txt


      sleep 15


      kubectl get validatingpolicies \
        -o yaml \
        > artifacts/integration-kind/validating-policies.yaml \
        2>&1 \
        || true


      kubectl get imagevalidatingpolicies \
        -o yaml \
        > artifacts/integration-kind/image-validating-policies.yaml \
        2>&1 \
        || true


      kubectl get mutatingpolicies \
        -o yaml \
        > artifacts/integration-kind/mutating-policies.yaml \
        2>&1 \
        || true


    # --------------------------------------------------------
    # 5. Check policy status
    #
    # Nếu Kyverno compile policy không thành công,
    # không cho integration pass.
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kubectl get validatingpolicies \
        -o json \
        > artifacts/integration-kind/validating-policy-status.json \
        2>&1 \
        || true


      kubectl get imagevalidatingpolicies \
        -o json \
        > artifacts/integration-kind/image-policy-status.json \
        2>&1 \
        || true


      kubectl get mutatingpolicies \
        -o json \
        > artifacts/integration-kind/mutating-policy-status.json \
        2>&1 \
        || true


    # --------------------------------------------------------
    # 6. Remove all policies
    #
    # Sau đó chỉ apply một policy đại diện để admission
    # behavior không bị policy khác can thiệp.
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kubectl delete \
        --recursive \
        -f e2e_env/production/policies \
        --ignore-not-found \
        >/dev/null 2>&1 \
        || true


      sleep 5


    # --------------------------------------------------------
    # 7. Apply rendered KSP-POD-002 only
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      policy_file="$(
        find e2e_env/production/policies \
          -type f \
          -name 'KSP-POD-002-*.yaml' \
          -print \
          -quit
      )"


      if test -z "$policy_file"
      then

        echo "ERROR: rendered KSP-POD-002 not found."

        exit 1

      fi


      echo "Policy under admission test:"
      echo "$policy_file"


      kubectl apply -f "$policy_file" \
        2>&1 \
        | tee artifacts/integration-kind/ksp-pod-002-apply.txt


      sleep 10


    # --------------------------------------------------------
    # 8. Create production test namespace
    # --------------------------------------------------------
    - |
      set -eu


      kubectl create namespace ksp-ci


      kubectl label namespace ksp-ci \
        ksp.io/environment=production \
        ksp.io/profile=baseline \
        --overwrite


      kubectl get namespace ksp-ci \
        --show-labels \
        > "$CI_PROJECT_DIR/$FRAMEWORK_ROOT/artifacts/integration-kind/namespace.txt"


    # --------------------------------------------------------
    # 9. Positive admission
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      cat > /tmp/positive.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: ksp-positive
        namespace: ksp-ci
      spec:
        containers:
          - name: app
            image: registry.k8s.io/pause:3.10
            securityContext:
              privileged: false
      EOF


      kubectl create -f /tmp/positive.yaml \
        2>&1 \
        | tee artifacts/integration-kind/positive-admission.txt


      kubectl get pod ksp-positive \
        -n ksp-ci \
        -o yaml \
        > artifacts/integration-kind/positive-pod.yaml


    # --------------------------------------------------------
    # 10. Negative admission
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      cat > /tmp/negative.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: ksp-negative
        namespace: ksp-ci
      spec:
        containers:
          - name: app
            image: registry.k8s.io/pause:3.10
            securityContext:
              privileged: true
      EOF


      set +e


      kubectl create -f /tmp/negative.yaml \
        > artifacts/integration-kind/negative-admission.txt \
        2>&1


      negative_status=$?


      set -e


      cat artifacts/integration-kind/negative-admission.txt


      if test "$negative_status" -eq 0
      then

        echo "ERROR: privileged Pod was admitted."

        exit 1

      fi


      if ! grep -Eqi \
        'denied|privileged' \
        artifacts/integration-kind/negative-admission.txt
      then

        echo "ERROR: request failed, but not because of expected policy denial."

        exit 1

      fi


      if kubectl get pod ksp-negative \
        -n ksp-ci \
        >/dev/null 2>&1
      then

        echo "ERROR: denied Pod exists."

        exit 1

      fi


      echo "Negative admission correctly denied."


    # --------------------------------------------------------
    # 11. Evidence
    # --------------------------------------------------------
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"


      kubectl get policyreports \
        -A \
        -o yaml \
        > artifacts/integration-kind/policyreports.yaml \
        2>&1 \
        || true


      kubectl -n kyverno get \
        pods,svc,endpoints,endpointslices \
        -o wide \
        > artifacts/integration-kind/kyverno-health.txt


      kubectl -n kyverno logs \
        -l app.kubernetes.io/component=admission-controller \
        --all-containers \
        --since=10m \
        > artifacts/integration-kind/kyverno-admission.log \
        2>&1 \
        || true


      echo "KIND INTEGRATION PASSED."


  after_script:

    - |
      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT" \
        2>/dev/null \
        || exit 0


      mkdir -p artifacts/integration-kind


      if command -v kind >/dev/null 2>&1
      then

        kind export logs \
          artifacts/integration-kind/kind-cluster-logs \
          --name "${KIND_CLUSTER_NAME:-ksp-ci}" \
          >/dev/null 2>&1 \
          || true


        kind delete cluster \
          --name "${KIND_CLUSTER_NAME:-ksp-ci}" \
          >/dev/null 2>&1 \
          || true

      fi


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/integration-kind/

report:
  stage: report

  image: alpine:3.21.3

  needs:

    - job: validate
      artifacts: true

    - job: check-policy
      artifacts: true

    - job: unit
      artifacts: true

    - job: rendered-policy-test
      artifacts: true

    - job: regression
      artifacts: true

    - job: kind-integration
      artifacts: true
      optional: true


  when: always


  script:

    - |
      set -eu


      framework="$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      report_root="$framework/artifacts/report"


      mkdir -p \
        "$report_root/validate" \
        "$report_root/check-policy" \
        "$report_root/cli-unit" \
        "$report_root/rendered-policy-test" \
        "$report_root/regression" \
        "$report_root/integration-kind"


      if test -d "$framework/artifacts/validate"
      then

        cp -R \
          "$framework/artifacts/validate/." \
          "$report_root/validate/"

      fi


      if test -d "$framework/artifacts/check-policy"
      then

        cp -R \
          "$framework/artifacts/check-policy/." \
          "$report_root/check-policy/"

      fi


      if test -d "$framework/artifacts/cli-unit"
      then

        cp -R \
          "$framework/artifacts/cli-unit/." \
          "$report_root/cli-unit/"

      fi


      if test -d "$framework/artifacts/rendered-policy-test"
      then

        cp -R \
          "$framework/artifacts/rendered-policy-test/." \
          "$report_root/rendered-policy-test/"

      fi


      if test -d "$framework/artifacts/regression"
      then

        cp -R \
          "$framework/artifacts/regression/." \
          "$report_root/regression/"

      fi


      if test -d "$framework/artifacts/integration-kind"
      then

        cp -R \
          "$framework/artifacts/integration-kind/." \
          "$report_root/integration-kind/"

      fi


      find "$report_root" \
        -type f \
        -print \
        | sort \
        > "$report_root/manifest.txt"


      cat "$report_root/manifest.txt"


  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - k8s-security-framework/artifacts/report/