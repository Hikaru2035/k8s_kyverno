stages:
  - validate
  - unit
  - integration
  - report

variables:
  FRAMEWORK_ROOT: "k8s-security-framework"
  KYVERNO_VERSION: "v1.18.2"
  KYVERNO_CHART_VERSION: "3.8.2"
  KIND_VERSION: "v0.32.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  GIT_DEPTH: "0"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

harbor_auth_check:
  stage: validate
  tags:
    - harbor-runner
  script:
    - test -n "$HARBOR_USERNAME"
    - test -n "$HARBOR_PASSWORD"
    - |
      AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"
      STATUS="$(curl -sS \
        -o /dev/null \
        -w '%{http_code}' \
        -H "Authorization: Basic $AUTH" \
        https://harbor-public:30003/v2/)"
      echo "Harbor HTTP status: $STATUS"
      test "$STATUS" = "200"

validate:
  stage: validate
  image: python:3.12.11-slim-bookworm
  before_script:
    - python3 -m pip install --no-cache-dir PyYAML==6.0.2
    - mkdir -p "$CI_PROJECT_DIR/artifacts/validate"
  script:
    - |
      set -u
      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      set +e
      bash ./scripts/validate-policy-config.sh \
        > ../artifacts/validate/policy-config.txt 2>&1
      config_status=$?

      set -e
      cat ../artifacts/validate/policy-config.txt
      test "$config_status" -eq 0

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      EXPECTED_POLICY_COUNT=29
      baseline_count="$(sort -u profiles/baseline/policy-ids.txt | wc -l | tr -d ' ')"
      standard_count="$(sort -u profiles/standard/policy-ids.txt | wc -l | tr -d ' ')"
      restricted_count="$(sort -u profiles/restricted/policy-ids.txt | wc -l | tr -d ' ')"
      source_count="$(find policies -type d -name 'KSP-*' | wc -l | tr -d ' ')"

      printf 'Profile counts: baseline=%s standard=%s restricted=%s sources=%s\n' \
        "$baseline_count" "$standard_count" "$restricted_count" "$source_count"

      test "$baseline_count" -eq 13
      test "$standard_count" -eq 27
      test "$restricted_count" -eq "$EXPECTED_POLICY_COUNT"
      test "$source_count" -eq "$EXPECTED_POLICY_COUNT"
      grep -qx 'KSP-META-003' profiles/baseline/policy-ids.txt

    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"
      suite_count="$(
        find policies \
          -type f \
          -path '*/tests/kyverno-test.yaml' \
          | wc -l \
          | tr -d ' '
      )"
      echo "Policy suites found: $suite_count"

      set +e

      EXPECTED_POLICY_COUNT=29 \
        bash ./tests/policies/check-coverage.sh \
        > ../artifacts/validate/test-coverage.txt 2>&1

      coverage_status=$?

      set -e

      cat ../artifacts/validate/test-coverage.txt
      test "$coverage_status" -eq 0

    - |
      set -u
      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      set +e

      python3 - <<'PY' \
        > ../artifacts/validate/yaml-and-references.txt 2>&1

      from collections import Counter
      from pathlib import Path
      import os
      import sys
      import yaml

      root = Path.cwd()
      errors = []

      scan_roots = [
          root / "policies",
          root / "tests",
          root / "template",
          root.parent / "helm",
          root.parent / "monitoring",
          root.parent / "image-security",
          root / "profiles",
      ]

      yaml_files = [root.parent / "versions.yaml"]
      for scan_root in scan_roots:
          if scan_root.exists():
              candidates = (
                  list(scan_root.rglob("*.yaml"))
                  + list(scan_root.rglob("*.yml"))
              )
              yaml_files.extend(
                  path
                  for path in candidates
                  if "evidence" not in path.parts
                  and "reports" not in path.parts
              )

      gitlab_ci = root.parent / ".gitlab-ci.yml"
      if gitlab_ci.is_file():
          yaml_files.append(gitlab_ci)

      yaml_files = sorted(set(yaml_files))
      documents = {}

      for path in yaml_files:
          try:
              documents[path] = list(
                  yaml.safe_load_all(
                      path.read_text(encoding="utf-8")
                  )
              )
          except (
              OSError,
              UnicodeError,
              yaml.YAMLError,
          ) as exc:
              try:
                  location = path.relative_to(root.parent)
              except ValueError:
                  location = path
              errors.append(
                  f"invalid YAML {location}: {exc}"
              )

      policy_dirs = sorted(
          path
          for path in (root / "policies").rglob("KSP-*")
          if path.is_dir()
          and (path / "tests" / "kyverno-test.yaml").is_file()
      )

      policy_ids = [
          path.name
          for path in policy_dirs
      ]

      for policy_id, count in Counter(policy_ids).items():

          if count > 1:

              errors.append(
                  f"duplicate policy ID: {policy_id}"
              )

      policy_names = []
      manifests = []

      for policy_dir in policy_dirs:
          policy_id = policy_dir.name
          sources = sorted(
              policy_dir.glob(
                  f"{policy_id}-*.yaml"
              )
          )
          if len(sources) != 1:
              errors.append(
                  f"{policy_id}: expected one source policy, "
                  f"found {len(sources)}"
              )
          elif sources[0] in documents:
              for document in documents[sources[0]]:
                  if isinstance(document, dict):
                      name = (
                          document
                          .get("metadata", {})
                          .get("name")
                      )
                      if not name:
                          errors.append(
                              f"{policy_id}: "
                              "policy metadata.name is missing"
                          )
                      else:
                          policy_names.append(
                              (
                                  name,
                                  sources[0],
                              )
                          )

          manifest = (
              policy_dir
              / "tests"
              / "kyverno-test.yaml"
          )
          if not manifest.is_file():
              errors.append(
                  f"{policy_id}: "
                  "missing tests/kyverno-test.yaml"
              )
          else:
              manifests.append(manifest)

      for name, count in Counter(
          name
          for name, _ in policy_names
      ).items():
          if count > 1:
              locations = ", ".join(
                  str(path.relative_to(root))
                  for candidate, path
                  in policy_names
                  if candidate == name
              )
              errors.append(
                  "duplicate policy "
                  f"metadata.name '{name}': "
                  f"{locations}"
              )

      if not policy_dirs:
          errors.append(
              "no source policy directories found"
          )


      if len(manifests) != len(policy_dirs):
          errors.append(
              "policy/test mismatch: "
              f"{len(policy_dirs)} policy directories, "
              f"{len(manifests)} suites"
          )

      list_reference_keys = (
          "policies",
          "resources",
          "exceptions",
          "targetResources",
      )

      scalar_reference_keys = (
          "context",
          "variables",
          "userinfo",
      )

      result_reference_keys = (
          "patchedResource",
          "generatedResource",
          "cloneSourceResource",
      )

      for manifest in manifests:
          loaded = documents.get(
              manifest,
              [],
          )

          test = (
              loaded[0]
              if loaded
              else None
          )

          if not isinstance(test, dict):
              errors.append(
                  f"{manifest.relative_to(root)}: "
                  "expected one Test document"
              )
              continue

          if test.get("kind") != "Test":
              errors.append(
                  f"{manifest.relative_to(root)}: "
                  "kind must be Test"
              )

          for key in list_reference_keys:
              references = test.get(
                  key,
                  [],
              )
              if references is None:
                  continue

              if not isinstance(
                  references,
                  list,
              ):
                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"{key} must be a list"
                  )
                  continue

              for reference in references:
                  if (
                      not isinstance(reference, str)
                      or not (
                          manifest.parent
                          / reference
                      ).is_file()
                  ):
                      errors.append(
                          f"{manifest.relative_to(root)}: "
                          f"missing {key} reference "
                          f"{reference!r}"
                      )

          for key in scalar_reference_keys:
              reference = test.get(key)
              if (
                  reference is not None
                  and (
                      not isinstance(reference, str)
                      or not (
                          manifest.parent
                          / reference
                      ).is_file()
                  )
              ):
                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"missing {key} reference "
                      f"{reference!r}"
                  )

          for index, result in enumerate(
              test.get("results", [])
          ):
              if not isinstance(result, dict):
                  errors.append(
                      f"{manifest.relative_to(root)}: "
                      f"results[{index}] "
                      "must be a mapping"
                  )
                  continue

              for key in result_reference_keys:
                  reference = result.get(key)

                  if (
                      reference is not None
                      and (
                          not isinstance(reference, str)
                          or not (
                              manifest.parent
                              / reference
                          ).is_file()
                      )
                  ):
                      errors.append(
                          f"{manifest.relative_to(root)}: "
                          f"missing results[{index}]."
                          f"{key} reference "
                          f"{reference!r}"
                      )

      if errors:
          print(
              "Validation FAILED with "
              f"{len(errors)} error(s):"
          )
          for error in errors:
              print(f"ERROR: {error}")
          sys.exit(1)

      print(
          "Validation PASSED: "
          f"{len(yaml_files)} YAML files, "
          f"{len(policy_dirs)} policies, "
          f"{len(manifests)} suites."
      )
      PY

      validation_status=$?

      set -e
      cat ../artifacts/validate/yaml-and-references.txt
      exit "$validation_status"


  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/validate/

check-policy:
  stage: validate
  image: python:3.12.11-slim-bookworm
  needs:
    - job: validate
      artifacts: false
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python3 -m pip install --no-cache-dir PyYAML==6.0.2
    - mkdir -p "$CI_PROJECT_DIR/artifacts/check-policy"

  script:
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"
      python3 ./scripts/render-policies.py development \
        > ../artifacts/check-policy/render-development.txt \
        2>&1
      python3 ./scripts/render-policies.py staging \
        > ../artifacts/check-policy/render-staging.txt \
        2>&1
      python3 ./scripts/render-policies.py production \
        > ../artifacts/check-policy/render-production.txt \
        2>&1

      cat ../artifacts/check-policy/render-development.txt
      cat ../artifacts/check-policy/render-staging.txt
      cat ../artifacts/check-policy/render-production.txt

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      git status --porcelain -- tests/e2e_env \
        > ../artifacts/check-policy/render-drift.txt

      cat ../artifacts/check-policy/render-drift.txt

      if test -s ../artifacts/check-policy/render-drift.txt
      then
        echo "ERROR: rendered tests/e2e_env policy bundle is stale."
        echo "Source of truth and deployable policies are not synchronized."
        exit 1
      fi

      echo "CHECK POLICY PASSED."
      echo "tests/e2e_env is synchronized with policies/."


  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/check-policy/

unit:
  stage: unit
  tags:
    - harbor-runner
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  needs:
    - job: check-policy
      artifacts: false
    - job: harbor_auth_check
      artifacts: false
  before_script:
    - |
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker"
      mkdir -p "$DOCKER_CONFIG"

      AUTH="$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)"

      cat > "$DOCKER_CONFIG/config.json" <<EOF
      {
        "auths": {
          "harbor-public:30003": {
            "auth": "$AUTH"
          }
        }
      }
      EOF

      chmod 600 "$DOCKER_CONFIG/config.json"

    - kyverno version
    - mkdir -p "$CI_PROJECT_DIR/artifacts/cli-unit/junit"

  script:
    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kyverno version \
        > ../artifacts/cli-unit/kyverno-version.txt \
        2>&1

      overall_status=0
      pass_count=0
      fail_count=0
      EXPECTED_POLICY_COUNT=29
      summary="../artifacts/cli-unit/summary.txt"
      : > "$summary"

      mapfile -t manifests < <(
        find policies \
          -type f \
          -path '*/tests/kyverno-test.yaml' \
          | sort
      )

      suite_count="${#manifests[@]}"
      echo "CLI Unit executes all canonical policy suites and serves as the framework regression gate."
      echo "Expected policy suites: $EXPECTED_POLICY_COUNT"
      echo "Discovered policy suites: $suite_count"

      if test "$suite_count" -ne "$EXPECTED_POLICY_COUNT"
      then
        echo "ERROR: expected $EXPECTED_POLICY_COUNT policy suites, found $suite_count"
        exit 1
      fi

      for manifest in "${manifests[@]}"
      do
        tests_dir="$(dirname "$manifest")"
        policy_id="$(
          basename "$(
            dirname "$tests_dir"
          )"
        )"

        echo "=================================================="
        echo "UNIT TEST: $policy_id"
        echo "=================================================="

        raw_report="../artifacts/cli-unit/junit/${policy_id}.raw.txt"
        extracted_report="../artifacts/cli-unit/junit/${policy_id}.extracted.xml"
        xml_report="../artifacts/cli-unit/junit/${policy_id}.xml"

        set +e

        kyverno test "$tests_dir" \
          --registry \
          --remove-color \
          --detailed-results \
          --require-tests \
          > "../artifacts/cli-unit/${policy_id}.txt" \
          2>&1

        text_status=$?

        kyverno test "$tests_dir" \
          --registry \
          --remove-color \
          --require-tests \
          --output-format junit \
          > "$raw_report" \
          2>&1

        junit_status=$?

        set -e

        cat "../artifacts/cli-unit/${policy_id}.txt"

        sed -n \
          '/^<?xml /,/^<\/testsuites>$/p' \
          "$raw_report" \
          > "$extracted_report"

        sed \
          's#<failure message="\([^"]*\)">#<failure message="\1" />#' \
          "$extracted_report" \
          > "$xml_report"

        rm -f "$extracted_report"

        if test "$text_status" -ne 0 \
          || test "$junit_status" -ne 0 \
          || ! test -s "$xml_report"
        then
          overall_status=1
          fail_count=$((fail_count + 1))
          printf '%s FAIL\n' "$policy_id" >> "$summary"
        else
          pass_count=$((pass_count + 1))
          printf '%s PASS\n' "$policy_id" >> "$summary"
        fi
      done

      printf '\nTOTAL=%s\nPASS=%s\nFAIL=%s\n' \
        "$suite_count" "$pass_count" "$fail_count" >> "$summary"
      cat "$summary"

      exit "$overall_status"


  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/cli-unit/
    reports:
      junit:
        artifacts/cli-unit/junit/*.xml

rendered-policy-test:
  stage: integration
  image: alpine:3.21.3
  needs:
    - job: unit
      artifacts: false
    - job: check-policy
      artifacts: false
  before_script:
    - apk add --no-cache curl tar
    - |
      ARCH="$(uname -m)"

      case "$ARCH" in
        x86_64)
          KYVERNO_ARCH="x86_64"
          ;;
        aarch64|arm64)
          KYVERNO_ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture: $ARCH"
          exit 1
          ;;
      esac

      curl -fsSL \
        "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_${KYVERNO_ARCH}.tar.gz" \
        -o /tmp/kyverno.tar.gz

      tar -xzf /tmp/kyverno.tar.gz -C /tmp
      mv /tmp/kyverno /usr/local/bin/kyverno
      chmod +x /usr/local/bin/kyverno

      kyverno version

    - mkdir -p "$CI_PROJECT_DIR/artifacts/rendered-policy-test"

  script:
    - |
      set -u

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      TEST_ROOT="tests/e2e_env/production/tests/rendered"

      if ! find "$TEST_ROOT" \
        -type f \
        -name kyverno-test.yaml \
        -print \
        -quit \
        | grep -q .
      then
        echo "ERROR: no rendered policy tests found in $TEST_ROOT"
        exit 1
      fi

      find "$TEST_ROOT" \
        -type f \
        -name kyverno-test.yaml \
        | sort \
        > ../artifacts/rendered-policy-test/test-manifest.txt

      cat ../artifacts/rendered-policy-test/test-manifest.txt

      set +e

      kyverno test "$TEST_ROOT" \
        --remove-color \
        --detailed-results \
        --require-tests \
        > ../artifacts/rendered-policy-test/results.txt \
        2>&1

      rendered_test_status=$?

      set -e

      cat ../artifacts/rendered-policy-test/results.txt
      exit "$rendered_test_status"

  artifacts:
    when: always
    expire_in: 14 days

    paths:
      - artifacts/rendered-policy-test/

kind-integration:
  stage: integration
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command:
        - "--tls=false"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    KIND_CLUSTER_NAME: "ksp-ci"
  needs:
    - job: unit
      artifacts: false
    - job: rendered-policy-test
      artifacts: false
  rules:
    - changes:
        - k8s-security-framework/policies/**/*
        - k8s-security-framework/profiles/**/*
        - k8s-security-framework/tests/e2e_env/**/*
        - k8s-security-framework/tests/**/*
        - k8s-security-framework/scripts/**/*
        - .gitlab-ci.yml
    - when: never
  before_script:
    - apk add --no-cache bash curl ca-certificates tar gzip
    - |
      set -eu

      case "$(uname -m)" in
        x86_64)
          ARCH="amd64"
          ;;
        aarch64|arm64)
          ARCH="arm64"
          ;;
        *)
          echo "Unsupported architecture: $(uname -m)"
          exit 1
          ;;
      esac

      echo "$ARCH" > /tmp/ci-arch

    - |
      ARCH="$(cat /tmp/ci-arch)"

      curl -fsSLo /usr/local/bin/kind \
        "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${ARCH}"

      chmod +x /usr/local/bin/kind

      kind version

    - |
      ARCH="$(cat /tmp/ci-arch)"

      KUBECTL_VERSION="$(
        curl -L -s \
          https://dl.k8s.io/release/stable.txt
      )"

      curl -fsSLo /usr/local/bin/kubectl \
        "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"

      chmod +x /usr/local/bin/kubectl

      kubectl version --client

    - |
      ARCH="$(cat /tmp/ci-arch)"

      HELM_VERSION="v3.21.4"

      curl -fsSLo /tmp/helm.tar.gz \
        "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz"

      tar -xzf /tmp/helm.tar.gz \
        -C /tmp

      mv "/tmp/linux-${ARCH}/helm" \
        /usr/local/bin/helm

      chmod +x /usr/local/bin/helm

      helm version

    - docker info

  script:
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"
      mkdir -p ../artifacts/integration-kind

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kind create cluster \
        --name "$KIND_CLUSTER_NAME" \
        --wait 180s \
        2>&1 \
        | tee ../artifacts/integration-kind/kind-create.txt

      echo "=== Original Kubernetes API endpoint ==="
      kubectl config view \
        --minify \
        -o jsonpath='{.clusters[0].cluster.server}'
      echo

      API_SERVER="$(
        kubectl config view \
          --minify \
          -o jsonpath='{.clusters[0].cluster.server}'
      )"

      API_SERVER="$(
        echo "$API_SERVER" \
          | sed 's#127\.0\.0\.1#docker#'
      )"

      echo "Using Kubernetes API endpoint: $API_SERVER"

      kubectl config set-cluster \
        "kind-${KIND_CLUSTER_NAME}" \
        --server="$API_SERVER"

      echo "=== Connectivity check ==="

      kubectl cluster-info

      kubectl wait \
        --for=condition=Ready \
        node \
        --all \
        --timeout=120s

      kubectl get nodes -o wide \
        | tee ../artifacts/integration-kind/nodes.txt

      echo "=== KIND KUBECONFIG ==="
      kubectl config view --minify

      echo "=== DOCKER CONTAINERS ==="
      docker ps

      echo "=== KIND CONTROL PLANE PORT ==="
      docker port "${KIND_CLUSTER_NAME}-control-plane" 6443
    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      helm repo add kyverno \
        https://kyverno.github.io/kyverno/

      helm repo update

      helm install kyverno kyverno/kyverno \
        --namespace kyverno \
        --create-namespace \
        --version "$KYVERNO_CHART_VERSION" \
        --set admissionController.replicas=1 \
        --set backgroundController.replicas=1 \
        --set cleanupController.replicas=1 \
        --set reportsController.replicas=1 \
        --wait \
        --timeout 5m \
        2>&1 \
        | tee ../artifacts/integration-kind/kyverno-install.txt

      kubectl -n kyverno get pods -o wide \
        | tee ../artifacts/integration-kind/kyverno-pods.txt

      kubectl get validatingwebhookconfigurations \
        -o wide \
        > ../artifacts/integration-kind/webhooks.txt

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kubectl apply \
        --recursive \
        -f tests/e2e_env/production/policies \
        2>&1 \
        | tee ../artifacts/integration-kind/all-policy-apply.txt

      sleep 15

      kubectl get validatingpolicies \
        -o yaml \
        > ../artifacts/integration-kind/validating-policies.yaml \
        2>&1 \
        || true

      kubectl get imagevalidatingpolicies \
        -o yaml \
        > ../artifacts/integration-kind/image-validating-policies.yaml \
        2>&1 \
        || true

      kubectl get mutatingpolicies \
        -o yaml \
        > ../artifacts/integration-kind/mutating-policies.yaml \
        2>&1 \
        || true

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kubectl get validatingpolicies \
        -o json \
        > ../artifacts/integration-kind/validating-policy-status.json \
        2>&1 \
        || true

      kubectl get imagevalidatingpolicies \
        -o json \
        > ../artifacts/integration-kind/image-policy-status.json \
        2>&1 \
        || true

      kubectl get mutatingpolicies \
        -o json \
        > ../artifacts/integration-kind/mutating-policy-status.json \
        2>&1 \
        || true

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kubectl delete \
        --recursive \
        -f tests/e2e_env/production/policies \
        --ignore-not-found \
        >/dev/null 2>&1 \
        || true

      sleep 5


    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      policy_file="$(
        find tests/e2e_env/production/policies \
          -type f \
          -name 'KSP-POD-010-*.yaml' \
          -print \
          -quit
      )"

      if test -z "$policy_file"
      then
        echo "ERROR: rendered KSP-POD-010 not found."
        exit 1
      fi

      echo "Policy under admission test:"
      echo "$policy_file"

      kubectl apply -f "$policy_file" \
        2>&1 \
        | tee ../artifacts/integration-kind/ksp-pod-010-apply.txt

      sleep 10

    - |
      set -eu

      kubectl create namespace ksp-ci

      kubectl label namespace ksp-ci \
        ksp.io/environment=production \
        ksp.io/profile=baseline \
        --overwrite

      kubectl get namespace ksp-ci \
        --show-labels \
        > "$CI_PROJECT_DIR/artifacts/integration-kind/namespace.txt"

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      cat > /tmp/positive.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: ksp-positive
        namespace: ksp-ci
      spec:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: app
            image: registry.k8s.io/pause:3.10
      EOF

      kubectl create -f /tmp/positive.yaml \
        2>&1 \
        | tee ../artifacts/integration-kind/positive-admission.txt

      kubectl get pod ksp-positive \
        -n ksp-ci \
        -o yaml \
        > ../artifacts/integration-kind/positive-pod.yaml

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      cat > /tmp/negative.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: ksp-negative
        namespace: ksp-ci
      spec:
        containers:
          - name: app
            image: registry.k8s.io/pause:3.10
      EOF

      set +e

      kubectl create -f /tmp/negative.yaml \
        > ../artifacts/integration-kind/negative-admission.txt \
        2>&1

      negative_status=$?

      set -e

      cat ../artifacts/integration-kind/negative-admission.txt

      if test "$negative_status" -eq 0
      then
        echo "ERROR: Pod without seccomp was admitted."
        exit 1
      fi

      if ! grep -Eqi \
        'denied|seccomp|Require Seccomp' \
        ../artifacts/integration-kind/negative-admission.txt
      then
        echo "ERROR: request failed, but not because of expected policy denial."
        exit 1
      fi

      if kubectl get pod ksp-negative \
        -n ksp-ci \
        >/dev/null 2>&1
      then
        echo "ERROR: denied Pod exists."
        exit 1
      fi

      echo "Negative admission correctly denied."

    - |
      set -eu

      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      kubectl get policyreports \
        -A \
        -o yaml \
        > ../artifacts/integration-kind/policyreports.yaml \
        2>&1 \
        || true

      kubectl -n kyverno get \
        pods,svc,endpoints,endpointslices \
        -o wide \
        > ../artifacts/integration-kind/kyverno-health.txt

      kubectl -n kyverno logs \
        -l app.kubernetes.io/component=admission-controller \
        --all-containers \
        --since=10m \
        > ../artifacts/integration-kind/kyverno-admission.log \
        2>&1 \
        || true

      echo "KIND INTEGRATION PASSED."


  after_script:
    - |
      cd "$CI_PROJECT_DIR/$FRAMEWORK_ROOT" \
        2>/dev/null \
        || exit 0

      mkdir -p ../artifacts/integration-kind

      if command -v kind >/dev/null 2>&1
      then
        kind export logs \
          ../artifacts/integration-kind/kind-cluster-logs \
          --name "${KIND_CLUSTER_NAME:-ksp-ci}" \
          >/dev/null 2>&1 \
          || true
        kind delete cluster \
          --name "${KIND_CLUSTER_NAME:-ksp-ci}" \
          >/dev/null 2>&1 \
          || true
      fi


  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/integration-kind/

report:
  stage: report
  image: alpine:3.21.3
  needs:
    - job: validate
      artifacts: true
    - job: check-policy
      artifacts: true
    - job: unit
      artifacts: true
    - job: rendered-policy-test
      artifacts: true
    - job: kind-integration
      artifacts: true
      optional: true
  when: always
  script:
    - |
      set -eu

      framework="$CI_PROJECT_DIR/$FRAMEWORK_ROOT"

      report_root="$CI_PROJECT_DIR/artifacts/report"

      mkdir -p \
        "$report_root/validate" \
        "$report_root/check-policy" \
        "$report_root/cli-unit" \
        "$report_root/rendered-policy-test" \
        "$report_root/integration-kind"

      if test -d "$CI_PROJECT_DIR/artifacts/validate"
      then
        cp -R \
          "$CI_PROJECT_DIR/artifacts/validate/." \
          "$report_root/validate/"
      fi

      if test -d "$CI_PROJECT_DIR/artifacts/check-policy"
      then
        cp -R \
          "$CI_PROJECT_DIR/artifacts/check-policy/." \
          "$report_root/check-policy/"
      fi

      if test -d "$CI_PROJECT_DIR/artifacts/cli-unit"
      then
        cp -R \
          "$CI_PROJECT_DIR/artifacts/cli-unit/." \
          "$report_root/cli-unit/"
      fi

      if test -d "$CI_PROJECT_DIR/artifacts/rendered-policy-test"
      then
        cp -R \
          "$CI_PROJECT_DIR/artifacts/rendered-policy-test/." \
          "$report_root/rendered-policy-test/"
      fi

      if test -d "$CI_PROJECT_DIR/artifacts/integration-kind"
      then
        cp -R \
          "$CI_PROJECT_DIR/artifacts/integration-kind/." \
          "$report_root/integration-kind/"
      fi

      find "$report_root" \
        -type f \
        -print \
        | sort \
        > "$report_root/manifest.txt"

      cat "$report_root/manifest.txt"


  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/report/
