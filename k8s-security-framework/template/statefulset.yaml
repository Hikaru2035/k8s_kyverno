# Kubernetes Baseline Template: StatefulSet
# Replace ${...} before applying; see README.md for image/signature requirements.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    policies.ksp.io/owner: ${OWNER}
spec:
  serviceName: ${SERVICE_NAME} # Existing headless Service for this StatefulSet.
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault # KSP-POD-010
      # KSP-POD-013 permits omitted runAsUser; any explicit value must be > 0.
      containers:
        - name: ${CONTAINER_NAME}
          image: "${IMAGE}@${IMAGE_DIGEST}"
          resources:
            requests:
              cpu: "${CPU_REQUEST}"
              memory: "${MEMORY_REQUEST}"
            limits:
              cpu: "${CPU_LIMIT}"
              memory: "${MEMORY_LIMIT}"
