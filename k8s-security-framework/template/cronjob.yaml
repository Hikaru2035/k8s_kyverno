# Kubernetes Baseline Template: CronJob
# Replace ${...} before applying; see README.md for image/signature requirements.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    policies.ksp.io/owner: ${OWNER}
spec:
  schedule: "${CRON_SCHEDULE}"
  jobTemplate:
    metadata:
      # The generated Job is also matched by KSP-META-001 and KSP-META-002.
      labels:
        app.kubernetes.io/name: ${APP_NAME}
        policies.ksp.io/owner: ${OWNER}
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault # KSP-POD-010
          # KSP-POD-013 permits omitted runAsUser; any explicit value must be > 0.
          containers:
            - name: ${CONTAINER_NAME}
              image: "${IMAGE}@${IMAGE_DIGEST}"
              resources:
                requests:
                  cpu: "${CPU_REQUEST}"
                  memory: "${MEMORY_REQUEST}"
                limits:
                  cpu: "${CPU_LIMIT}"
                  memory: "${MEMORY_LIMIT}"
