# versions.yaml
# Single source of truth for component versions used by this project.
#
# Version baseline date: 2026-08-11
# Security rule:
# - No "latest" tags.
# - Use stable releases only.
# - Run vulnerability scan before production-candidate release.
# - Re-check versions before final PoC release.

framework:
  name: kyverno-security-framework
  version: "0.1.0"

platform:
  os:
    name: ubuntu-server
    version: "22.04.5"

  kubernetes:
    version: "1.35.7"
    kubeadm: "1.35.7"
    kubelet: "1.35.7"
    kubectl: "1.35.7"

  runtime:
    name: containerd
    version: "2.2.1"

networking:
  cni:
    name: calico
    version: "3.28.0"

package_management:
  helm:
    version: "TBD"

policy_engine:
  kyverno:
    version: "TBD"
  kyverno_cli:
    version: "TBD"

image_security:
  harbor:
    version: "TBD"
  cosign:
    version: "TBD"

testing:
  kind:
    version: "TBD"

monitoring:
  prometheus:
    version: "TBD"
  grafana:
    version: "TBD"

cluster:
  type: multi-node

  node_network: "192.168.101.0/24"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"

  nodes:
    control_plane:
      hostname: control-plane
      ip: "192.168.101.80"

    worker_01:
      hostname: worker-node-1
      ip: "192.168.101.81"

    worker_02:
      hostname: worker-node-2
      ip: "192.168.101.82"