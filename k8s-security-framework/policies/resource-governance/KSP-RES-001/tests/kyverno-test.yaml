apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-res-001-require-cpu-request

policies:
- ../KSP-RES-001-require-cpu-request.yaml

resources:
- boundary-init-container-with-cpu-request.yaml
- exception-resources-with-policy-violation.yaml
- negative-container-missing-cpu-request.yaml
- negative-init-container-missing-resource.yaml
- negative-resource-missing-first.yaml
- negative-resource-missing-last.yaml
- positive-container-with-cpu-request.yaml
- positive-ephemeral-container-without-resource.yaml
- positive-two-containers-with-resource.yaml
- boundary-pass-additional-edge-case.yaml
- boundary-fail-single-condition.yaml

exceptions:
- exception-policy-for-specific-resources.yaml

results:
- policy: require-cpu-request
  rule: require-cpu-request
  kind: Pod
  resources:
  - res-001-boundary-init
  - res-001-positive
  - ksp-res-001-positive-ephemeral-ignored
  - ksp-res-001-positive-two-resource
  - res-001-boundary-init-additional-boundary-pass
  result: pass

- policy: require-cpu-request
  rule: require-cpu-request
  kind: Pod
  resources:
  - res-001-negative
  - ksp-res-001-negative-init-missing
  - ksp-res-001-negative-missing-first
  - ksp-res-001-negative-missing-last
  - ksp-res-001-negative-init-missing-additional-boundary-fail
  result: fail

- policy: require-cpu-request
  rule: require-cpu-request
  kind: Pod
  resources:
  - ksp-res-001-exception
  - ksp-res-001-exception-secondary
  - ksp-res-001-exception-tertiary
  result: skip