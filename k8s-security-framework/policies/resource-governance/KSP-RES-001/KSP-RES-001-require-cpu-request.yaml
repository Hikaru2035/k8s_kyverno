apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-cpu-request
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-res-001
  annotations:
    policies.kyverno.io/title: Require CPU Request
    policies.kyverno.io/category: KSP Resource Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires a CPU request on regular and init containers.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
      c.?resources.requests.cpu.orValue('') != '')
    message: Set resources.requests.cpu on every regular and init container.

