apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: generate-resource-quota-exception
  namespace: policy-test
spec:
  policyRefs:
  - name: generate-resource-quota
    kind: ValidatingPolicy
  matchConditions:
  - name: match-exempt-resource
    expression: object.metadata.name == 'ksp-res-005-exception' && object.metadata.namespace
      == 'policy-test'

