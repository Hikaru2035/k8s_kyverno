apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-resource-quota
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-res-005}
  annotations:
    policies.kyverno.io/title: Generate ResourceQuota
    policies.kyverno.io/category: KSP Resource Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace,ResourceQuota
    policies.kyverno.io/description: Generates a synchronized bootstrap quota for opted-in application namespaces.
    policies.ksp.io/parameter: Replace bootstrap quota with environment-specific sizing before production rollout.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Generate
    policies.ksp.io/staging-mode: Generate
    policies.ksp.io/prod-mode: Generate
    policies.ksp.io/exception: controlled
spec:
  background: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: generate-resource-quota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  policies.ksp.io/generate-resource-governance: enabled
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: namespace-resource-quota
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        generateExisting: true
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
              policies.ksp.io/generated-by: ksp-res-005
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "8"
              limits.memory: 16Gi
              pods: "50"
