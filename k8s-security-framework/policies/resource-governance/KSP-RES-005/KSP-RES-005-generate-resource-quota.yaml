apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-resource-quota
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-res-005
  annotations:
    policies.kyverno.io/title: Generate ResourceQuota
    policies.kyverno.io/category: KSP Resource Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace,ResourceQuota
    policies.kyverno.io/description: >-
      Generates synchronized environment- and quota-class-specific
      ResourceQuota objects for opted-in application namespaces.
    policies.ksp.io/parameter: >-
      Quota sizing is loaded from the ksp-resource-quota-sizing ConfigMap
      according to policies.ksp.io/environment and policies.ksp.io/quota-class.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Generate
    policies.ksp.io/staging-mode: Generate
    policies.ksp.io/prod-mode: Generate
    policies.ksp.io/exception: controlled

spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true

  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces

  matchConditions:
  - name: opted-in-namespace
    expression: >-
      object.metadata.?labels[
        "policies.ksp.io/generate-resource-governance"
      ].orValue("") == "enabled"
  - name: valid-environment
    expression: >-
      object.metadata.?labels[
        "policies.ksp.io/environment"
      ].orValue("") in [
        "dev",
        "staging",
        "production"
      ]
  - name: valid-quota-class
    expression: >-
      object.metadata.?labels[
        "policies.ksp.io/quota-class"
      ].orValue("") in [
        "small",
        "medium",
        "large"
      ]

  variables:
  - name: namespaceName
    expression: object.metadata.name
  - name: environment
    expression: object.metadata.labels["policies.ksp.io/environment"]
  - name: quotaClass
    expression: object.metadata.labels["policies.ksp.io/quota-class"]
  - name: quotaConfig
    expression: >-
      resource.Get(
        "v1",
        "configmaps",
        "kyverno",
        "ksp-resource-quota-sizing"
      )
  - name: quotaKey
    expression: >-
      string(variables.environment)
      + "."
      + string(variables.quotaClass)
  - name: requestsCpu
    expression: variables.quotaConfig.data[variables.quotaKey + ".requestsCpu"]
  - name: requestsMemory
    expression: variables.quotaConfig.data[variables.quotaKey + ".requestsMemory"]
  - name: limitsCpu
    expression: variables.quotaConfig.data[variables.quotaKey + ".limitsCpu"]
  - name: limitsMemory
    expression: variables.quotaConfig.data[variables.quotaKey + ".limitsMemory"]
  - name: pods
    expression: variables.quotaConfig.data[variables.quotaKey + ".pods"]

  - name: downstream
    expression: |-
      [
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("ResourceQuota"),

          "metadata": dyn({
            "name": dyn("namespace-resource-quota"),
            "labels": dyn({
              "app.kubernetes.io/managed-by": "kyverno",
              "policies.ksp.io/generated-by": "ksp-res-005",
              "policies.ksp.io/environment": string(variables.environment),
              "policies.ksp.io/quota-class": string(variables.quotaClass)
            })
          }),

          "spec": dyn({
            "hard": dyn({
              "requests.cpu": dyn(string(variables.requestsCpu)),
              "requests.memory": dyn(string(variables.requestsMemory)),
              "limits.cpu": dyn(string(variables.limitsCpu)),
              "limits.memory": dyn(string(variables.limitsMemory)),
              "pods": dyn(string(variables.pods))
            })
          })
        }
      ]

  generate:
  - expression: >-
      generator.Apply(
        variables.namespaceName,
        variables.downstream
      )
