apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-limit-range
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-res-006}
  annotations:
    policies.kyverno.io/title: Generate LimitRange
    policies.kyverno.io/category: KSP Resource Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace,LimitRange
    policies.kyverno.io/description: Generates synchronized container defaults for opted-in application namespaces.
    policies.ksp.io/parameter: Replace bootstrap defaults with environment-specific sizing before production rollout.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Generate
    policies.ksp.io/staging-mode: Generate
    policies.ksp.io/prod-mode: Generate
    policies.ksp.io/exception: controlled
spec:
  background: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: generate-limit-range
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  policies.ksp.io/generate-resource-governance: enabled
      generate:
        apiVersion: v1
        kind: LimitRange
        name: container-resource-defaults
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        generateExisting: true
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
              policies.ksp.io/generated-by: ksp-res-006
          spec:
            limits:
              - type: Container
                defaultRequest: {cpu: 100m, memory: 128Mi}
                default: {cpu: 500m, memory: 512Mi}
                min: {cpu: 25m, memory: 32Mi}
                max: {cpu: "2", memory: 2Gi}
