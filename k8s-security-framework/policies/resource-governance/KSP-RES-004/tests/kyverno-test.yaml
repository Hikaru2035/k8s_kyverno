    rule: require-memory-limit
    kind: Pod
    resources:
      - res-004-boundary-init
    result: pass
  - policy: require-memory-limit
    rule: require-memory-limit
    kind: Pod
    resources:
      - ksp-res-004-exception
    result: skip
