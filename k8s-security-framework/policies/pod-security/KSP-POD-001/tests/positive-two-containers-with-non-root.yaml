apiVersion: v1
kind: Pod
metadata:
  name: pod-001-positive-two-containers-non-root
  namespace: policy-test
spec:
  containers:
    - name: demo-api
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        runAsNonRoot: true
    - name: sidecar
      image: harbor.example.com/sidecar:1.0.0
      securityContext:
        runAsNonRoot: true
