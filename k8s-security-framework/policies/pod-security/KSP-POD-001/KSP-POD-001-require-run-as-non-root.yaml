apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-pod-001
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires Pod or container runAsNonRoot=true.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true && variables.allContainers.all(container, container.?securityContext.?runAsNonRoot.orValue(true) == true)) || variables.allContainers.all(container, container.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: Set Pod runAsNonRoot=true without any container overriding it to false, or set runAsNonRoot=true on every container.