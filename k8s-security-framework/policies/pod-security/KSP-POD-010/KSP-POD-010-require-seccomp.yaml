apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-010}
  annotations:
    policies.kyverno.io/title: Require Seccomp
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires RuntimeDefault or Localhost seccomp at Pod or container level.
    policies.ksp.io/profiles: restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: require-seccomp
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Use seccompProfile.type RuntimeDefault or Localhost.
        anyPattern:
          - spec:
              securityContext:
                seccompProfile: {type: RuntimeDefault | Localhost}
          - spec:
              containers:
                - securityContext: {seccompProfile: {type: RuntimeDefault | Localhost}}
              =(initContainers):
                - securityContext: {seccompProfile: {type: RuntimeDefault | Localhost}}
              =(ephemeralContainers):
                - securityContext: {seccompProfile: {type: RuntimeDefault | Localhost}}
