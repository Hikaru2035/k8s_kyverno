apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: require-seccomp-exception
  namespace: policy-test
spec:
  policyRefs:
  - name: require-seccomp
    kind: ValidatingPolicy
  matchConditions:
  - name: match-exempt-resource
    expression: object.metadata.name == 'ksp-pod-010-exception' && object.metadata.namespace
      == 'policy-test'

