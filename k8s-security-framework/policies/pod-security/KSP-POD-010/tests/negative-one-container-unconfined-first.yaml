apiVersion: v1
kind: Pod
metadata:
  name: pod-010-negative-unconfined-first
  namespace: policy-test
spec:
  containers:
    - name: insecure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        seccompProfile:
          type: Unconfined
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        seccompProfile:
          type: RuntimeDefault
