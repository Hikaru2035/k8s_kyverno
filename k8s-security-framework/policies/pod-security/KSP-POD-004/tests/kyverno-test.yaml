- policy: disallow-host-network
  rule: disallow-host-network
  kind: Pod
  resources:
  - pod-004-negative-true-two
  - pod-004-boundary-additional-boundary-fail
  result: fail

- policy: disallow-host-network
  rule: disallow-host-network
  kind: Pod
  resources:
  - ksp-pod-004-exception
  - ksp-pod-004-exception-secondary
  - ksp-pod-004-exception-tertiary
  result: skip