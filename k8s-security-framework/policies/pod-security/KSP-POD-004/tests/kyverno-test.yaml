apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-pod-004-disallow-host-network
policies:
- ../KSP-POD-004-disallow-host-network.yaml
resources:
- boundary-pass-additional-edge-case.yaml
- boundary-fail-single-condition.yaml
- exception-resources-with-policy-violation.yaml
- negative-hostnetwork-true-with-two-containers.yaml
- positive-hostnetwork-false-with-two-containers.yaml
- positive-hostnetwork-unset-with-two-containers.yaml
