apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-network
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-pod-004
  annotations:
    policies.kyverno.io/title: Disallow Host Network
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Prevents Pods from sharing the host network namespace.
    policies.ksp.io/profiles: baseline,standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled

spec:
  evaluation:
    background:
      enabled: true

  failurePolicy: Fail

  webhookConfiguration:
    timeoutSeconds: 10

  validationActions:
  - Audit
  - Warn

  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods

  variables:
  - name: hostNetwork
    expression: object.spec.?hostNetwork.orValue(false)

  validations:
  - expression: variables.hostNetwork == false
    message: spec.hostNetwork must be unset or false.