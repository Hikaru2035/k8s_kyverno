apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-added-capabilities
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-009}
  annotations:
    policies.kyverno.io/title: Restrict Added Capabilities
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Allows only NET_BIND_SERVICE when Linux capabilities are added.
    policies.ksp.io/profiles: restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: restrict-added-capabilities
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Only NET_BIND_SERVICE may be added as a Linux capability.
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(capabilities):
                    =(add): [NET_BIND_SERVICE]
            =(initContainers):
              - =(securityContext):
                  =(capabilities):
                    =(add): [NET_BIND_SERVICE]
            =(ephemeralContainers):
              - =(securityContext):
                  =(capabilities):
                    =(add): [NET_BIND_SERVICE]
