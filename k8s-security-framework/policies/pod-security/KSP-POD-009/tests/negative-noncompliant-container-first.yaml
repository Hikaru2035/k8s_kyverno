apiVersion: v1
kind: Pod
metadata:
  name: pod-009-negative-first
  namespace: policy-test
spec:
  containers:
    - name: insecure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          add: [SYS_ADMIN]
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          add: [NET_BIND_SERVICE]
