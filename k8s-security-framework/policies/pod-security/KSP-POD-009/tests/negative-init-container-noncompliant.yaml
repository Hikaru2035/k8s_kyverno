apiVersion: v1
kind: Pod
metadata:
  name: ksp-pod-009-negative-init
  namespace: policy-test
spec:
  containers:
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          add: [NET_BIND_SERVICE]
  initContainers:
    - name: init
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          add: [SYS_ADMIN]
