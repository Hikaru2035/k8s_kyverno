apiVersion: v1
kind: Pod
metadata:
  name: ksp-pod-007-exception
  namespace: policy-test
spec:
  volumes:
  - name: host-root
    hostPath:
      path: /
  containers:
  - name: demo-api
    image: harbor.example.com/demo-api:1.0.0
    volumeMounts:
    - name: host-root
      mountPath: /host
---
apiVersion: v1
kind: Pod
metadata:
  name: ksp-pod-007-exception-secondary
  namespace: policy-test
spec:
  volumes:
  - name: host-root
    hostPath:
      path: /
  containers:
  - name: demo-api
    image: harbor.example.com/demo-api:1.0.0
    volumeMounts:
    - name: host-root
      mountPath: /host
---
apiVersion: v1
kind: Pod
metadata:
  name: ksp-pod-007-exception-tertiary
  namespace: policy-test
spec:
  volumes:
  - name: host
    hostPath:
      path: /var/log
  - name: cache
    emptyDir: {}
  containers:
  - name: demo-api
    image: harbor.example.com/demo-api:1.0.0
