apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-008}
  annotations:
    policies.kyverno.io/title: Drop ALL Capabilities
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires all container types to drop all Linux capabilities.
    policies.ksp.io/profiles: restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: drop-all-capabilities
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Add capabilities.drop with ALL to every container.
        pattern:
          spec:
            containers:
              - securityContext: {capabilities: {drop: [ALL]}}
            =(initContainers):
              - securityContext: {capabilities: {drop: [ALL]}}
            =(ephemeralContainers):
              - securityContext: {capabilities: {drop: [ALL]}}
