apiVersion: v1
kind: Pod
metadata:
  name: pod-008-positive-all-types
  namespace: policy-test
spec:
  containers:
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          drop: [ALL]
  initContainers:
    - name: init
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          drop: [ALL]
  ephemeralContainers:
    - name: debugger
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          drop: [ALL]
      command: ["sh"]
