    rule: drop-all-capabilities
    kind: Pod
    resources:
      - pod-008-negative
    result: fail
  - policy: drop-all-capabilities
    rule: drop-all-capabilities
    kind: Pod
    resources:
      - pod-008-boundary-init
    result: pass
  - policy: drop-all-capabilities
    rule: drop-all-capabilities
    kind: Pod
    resources:
      - ksp-pod-008-exception
    result: skip
