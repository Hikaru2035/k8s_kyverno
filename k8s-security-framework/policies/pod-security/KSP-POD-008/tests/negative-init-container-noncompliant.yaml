apiVersion: v1
kind: Pod
metadata:
  name: pod-008-negative-init
  namespace: policy-test
spec:
  containers:
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          drop: [ALL]
  initContainers:
    - name: init
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        capabilities:
          drop: [NET_RAW]
