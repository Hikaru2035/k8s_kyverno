apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: add-default-security-context-exception
  namespace: security-test
spec:
  policyRefs:
  - name: add-default-security-context
    kind: MutatingPolicy
  matchConditions:
  - name: match-exempt-resource
    expression: object.metadata.name == 'ksp-pod-012-exception'
      && object.metadata.namespace == 'security-test'
