apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: ksp-pod-012-values
namespaceSelector:
- name: p012-boundary-pod-with-existing-security-defaults
  labels: &optedIn
    policies.ksp.io/mutate-default-security-context: enabled
- name: p012-boundary-preserve-explicit-container-settings
  labels: *optedIn
- name: p012-boundary-pass-additional-edge-case
  labels: *optedIn
- name: p012-positive-init-container-missing-defaults
  labels: *optedIn
- name: p012-positive-opted-in-pod-missing-security-defaults
  labels: *optedIn
- name: p012-positive-two-containers-missing-defaults
  labels: *optedIn
- name: p012-partial-and-ephemeral
  labels: *optedIn
- name: security-test
  labels: *optedIn
