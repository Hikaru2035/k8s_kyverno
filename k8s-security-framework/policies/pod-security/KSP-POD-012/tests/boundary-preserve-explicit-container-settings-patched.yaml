apiVersion: v1
kind: Pod
metadata:
  name: pod-012-boundary-preserve-explicit
  namespace: p012-boundary-preserve-explicit-container-settings
spec:
  containers:
  - name: demo-api
    image: harbor.example.com/demo-api:1.0.0
    securityContext:
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: false
      capabilities:
        drop:
        - NET_RAW
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
