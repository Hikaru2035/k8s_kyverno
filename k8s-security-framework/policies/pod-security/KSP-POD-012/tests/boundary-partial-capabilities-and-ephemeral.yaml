apiVersion: v1
kind: Pod
metadata:
  name: pod-012-partial-and-ephemeral
  namespace: p012-partial-and-ephemeral
spec:
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/example.json
  containers:
  - name: app
    image: harbor.example.com/demo-api:1.0.0
    securityContext:
      capabilities:
        add:
        - NET_BIND_SERVICE
  initContainers:
  - name: init
    image: harbor.example.com/demo-api:1.0.0
    securityContext:
      capabilities:
        add:
        - NET_BIND_SERVICE
  ephemeralContainers:
  - name: debugger
    image: harbor.example.com/debug:1.0.0
    command:
    - sh
    targetContainerName: app
    securityContext:
      capabilities:
        add:
        - NET_BIND_SERVICE
