apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-pod-012-add-default-security-context

policies:
- ../KSP-POD-012-add-default-security-context.yaml

variables: values.yaml

resources:
- boundary-pod-with-existing-security-defaults.yaml
- boundary-preserve-explicit-container-settings.yaml
- exception-resources-with-policy-violation.yaml
- negative-pod-in-namespace-without-opt-in.yaml
- positive-init-container-missing-defaults.yaml
- positive-opted-in-pod-missing-security-defaults.yaml
- positive-two-containers-missing-defaults.yaml
- boundary-pass-additional-edge-case.yaml
- boundary-fail-single-condition.yaml
- boundary-partial-capabilities-and-ephemeral.yaml

exceptions:
- exception-policy-for-specific-resources.yaml

results:
- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-boundary-existing
  patchedResources: boundary-pod-with-existing-security-defaults-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-boundary-preserve-explicit
  patchedResources: boundary-preserve-explicit-container-settings-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-positive-init
  patchedResources: positive-init-container-missing-defaults-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-positive
  patchedResources: positive-opted-in-pod-missing-security-defaults-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-positive-two-containers
  patchedResources: positive-two-containers-missing-defaults-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-boundary-existing-additional-boundary-pass
  patchedResources: boundary-pass-additional-edge-case-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - pod-012-partial-and-ephemeral
  patchedResources: boundary-partial-capabilities-and-ephemeral-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - ksp-pod-012-exception-secondary
  patchedResources: exception-similar-name-patched.yaml
  result: pass

- policy: add-default-security-context
  rule: add-default-security-context
  kind: Pod
  resources:
  - ksp-pod-012-exception
  - pod-012-negative
  - pod-012-negative-additional-boundary-fail
  result: skip
