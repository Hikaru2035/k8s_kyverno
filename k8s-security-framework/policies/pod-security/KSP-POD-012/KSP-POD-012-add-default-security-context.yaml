apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-security-context
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-012}
  annotations:
    policies.kyverno.io/title: Add Default Security Context
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Adds non-destructive secure defaults only in explicitly opted-in namespaces.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Mutate
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Disabled
    policies.ksp.io/exception: controlled
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: add-default-security-context
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  policies.ksp.io/mutate-default-security-context: enabled
      mutate:
        mutateExistingOnPolicyUpdate: false
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(seccompProfile): {type: RuntimeDefault}
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(readOnlyRootFilesystem): true
                  +(capabilities): {drop: [ALL]}
            +(initContainers):
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(readOnlyRootFilesystem): true
                  +(capabilities): {drop: [ALL]}
