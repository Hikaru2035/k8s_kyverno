apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-pod-011-require-read-only-root-filesystem

policies:
- ../KSP-POD-011-require-read-only-root-filesystem.yaml

resources:
- boundary-init-container-read-only-root.yaml
- boundary-fail-single-condition.yaml
- exception-resources-with-policy-violation.yaml
- negative-ephemeral-container-noncompliant.yaml
- negative-init-container-noncompliant.yaml
- negative-noncompliant-container-first.yaml
- negative-noncompliant-container-last.yaml
- negative-writable-root-filesystem.yaml
- positive-all-container-types-compliant.yaml
- positive-read-only-root-filesystem.yaml
- positive-two-containers-compliant.yaml
exceptions:
- exception-policy-for-specific-resources.yaml

results:
- policy: require-read-only-root-filesystem
  rule: require-read-only-root-filesystem
  kind: Pod
  resources:
  - pod-011-boundary-init
  - pod-011-positive-all-types
  - pod-011-positive
  - pod-011-positive-two-compliant
  result: pass

- policy: require-read-only-root-filesystem
  rule: require-read-only-root-filesystem
  kind: Pod
  resources:
  - pod-011-negative-ephemeral
  - pod-011-negative-init
  - pod-011-negative-first
  - pod-011-negative-last
  - pod-011-negative
  - pod-011-boundary-ephemeral-additional-boundary-fail
  result: fail

- policy: require-read-only-root-filesystem
  rule: require-read-only-root-filesystem
  kind: Pod
  resources:
  - ksp-pod-011-exception
  - ksp-pod-011-exception-secondary
  - ksp-pod-011-exception-tertiary
  result: skip