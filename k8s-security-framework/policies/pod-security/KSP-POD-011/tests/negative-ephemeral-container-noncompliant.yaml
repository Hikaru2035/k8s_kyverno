apiVersion: v1
kind: Pod
metadata:
  name: pod-011-negative-ephemeral
  namespace: policy-test
spec:
  containers:
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        readOnlyRootFilesystem: true
  ephemeralContainers:
    - name: debugger
      image: harbor.example.com/demo-api:1.0.0
      command: ["sh"]
      securityContext:
        readOnlyRootFilesystem: false
