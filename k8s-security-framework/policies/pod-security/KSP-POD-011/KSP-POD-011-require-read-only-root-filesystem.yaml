apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-read-only-root-filesystem
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-pod-011
  annotations:
    policies.kyverno.io/title: Require ReadOnly Root Filesystem
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires a read-only root filesystem for every
      container type.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (((object.spec.containers + object.spec.?initContainers.orValue([])
      + object.spec.?ephemeralContainers.orValue([])))).all(c, c.?securityContext.readOnlyRootFilesystem.orValue(false))
    message: Set readOnlyRootFilesystem=true and mount explicit writable volumes.

