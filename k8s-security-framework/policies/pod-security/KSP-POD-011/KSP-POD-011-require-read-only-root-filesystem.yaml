apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-read-only-root-filesystem
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-011}
  annotations:
    policies.kyverno.io/title: Require ReadOnly Root Filesystem
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires a read-only root filesystem for every container type.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: require-read-only-root-filesystem
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Set readOnlyRootFilesystem=true and mount explicit writable volumes.
        pattern:
          spec:
            containers:
              - securityContext: {readOnlyRootFilesystem: true}
            =(initContainers):
              - securityContext: {readOnlyRootFilesystem: true}
            =(ephemeralContainers):
              - securityContext: {readOnlyRootFilesystem: true}
