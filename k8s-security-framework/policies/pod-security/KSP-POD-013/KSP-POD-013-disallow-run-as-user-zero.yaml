apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-run-as-user-zero
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-pod-013
  annotations:
    policies.kyverno.io/title: Disallow Run As User 0
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Rejects explicit UID zero at Pod or container level.
    policies.ksp.io/profiles: restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods

  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])

  - name: podRunAsUser
    expression: object.spec.?securityContext.?runAsUser.orValue(1)

  validations:
  - expression: >
      variables.podRunAsUser > 0 &&
      variables.allContainers.all(
        container,
        container.?securityContext.?runAsUser.orValue(1) > 0
      )
    message: runAsUser must be greater than zero when explicitly configured.