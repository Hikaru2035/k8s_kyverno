apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-pod-002
  annotations:
    policies.kyverno.io/title: Disallow Privileged
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Blocks privileged regular, init, and ephemeral
      containers.
    policies.ksp.io/profiles: baseline,standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Enforce
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (((object.spec.containers + object.spec.?initContainers.orValue([])
      + object.spec.?ephemeralContainers.orValue([])))).all(c, !c.?securityContext.privileged.orValue(false))
    message: privileged=true is prohibited for every container type.

