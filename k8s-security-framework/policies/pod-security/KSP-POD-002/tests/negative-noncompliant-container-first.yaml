apiVersion: v1
kind: Pod
metadata:
  name: pod-002-negative-first-container-privileged-true
  namespace: policy-test
spec:
  containers:
    - name: insecure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        privileged: true
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        privileged: false
