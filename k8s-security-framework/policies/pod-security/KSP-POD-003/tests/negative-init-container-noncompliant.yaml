apiVersion: v1
kind: Pod
metadata:
  name: pod-003-negative-init
  namespace: policy-test
spec:
  containers:
    - name: secure
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        allowPrivilegeEscalation: false
  initContainers:
    - name: init
      image: harbor.example.com/demo-api:1.0.0
      securityContext:
        allowPrivilegeEscalation: true
