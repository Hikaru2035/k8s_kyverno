apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-pod-003}
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: KSP Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires allowPrivilegeEscalation=false for every container type.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Enforce
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: disallow-privilege-escalation
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Set allowPrivilegeEscalation=false on every container.
        pattern:
          spec:
            containers:
              - securityContext: {allowPrivilegeEscalation: false}
            =(initContainers):
              - securityContext: {allowPrivilegeEscalation: false}
            =(ephemeralContainers):
              - securityContext: {allowPrivilegeEscalation: false}
