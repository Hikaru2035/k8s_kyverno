apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-pod-006-disallow-host-ipc
policies:
- ../KSP-POD-006-disallow-host-ipc.yaml
resources:
- exception-resources-with-policy-violation.yaml
- negative-hostipc-true-with-two-containers.yaml
- positive-hostipc-false-with-two-containers.yaml
- positive-hostipc-unset-with-two-containers.yaml
- boundary-pass-additional-edge-case.yaml
- boundary-fail-single-condition.yaml
exceptions:
- exception-policy-for-specific-resources.yaml

results:
- policy: disallow-host-ipc
  rule: disallow-host-ipc
  kind: Pod
  resources:
  - pod-006-positive-false-two
  - pod-006-positive-unset-two
  - pod-006-boundary-unset-additional-boundary-pass
  result: pass

- policy: disallow-host-ipc
  rule: disallow-host-ipc
  kind: Pod
  resources:
  - pod-006-negative-true-two
  - pod-006-boundary-additional-boundary-fail
  result: fail

- policy: disallow-host-ipc
  rule: disallow-host-ipc
  kind: Pod
  resources:
  - ksp-pod-006-exception
  - ksp-pod-006-exception-secondary
  - ksp-pod-006-exception-tertiary
  result: skip