apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-img-001
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: KSP Image Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires an explicit non-latest tag or digest for every image.
    policies.ksp.io/profiles: baseline,standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Enforce
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods

  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])

  validations:
  - expression: variables.allContainers.all(container, container.image.matches('^.+@.+$') || (container.image.matches('^.+:[^/]+$') && !container.image.endsWith(':latest')))
    message: Use an explicit version tag or sha256 digest; latest and untagged images are prohibited.
