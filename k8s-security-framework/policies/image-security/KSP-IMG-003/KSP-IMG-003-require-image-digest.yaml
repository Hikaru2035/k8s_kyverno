apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-img-003}
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: KSP Image Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Requires immutable sha256 image references.
    policies.ksp.io/profiles: restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: require-image-digest
      match: {any: [{resources: {kinds: [Pod]}}]}
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Reference every image as image@sha256:<64-hex-digest>.
        foreach:
          - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^.+@sha256:[a-fA-F0-9]{64}$', element.image) }}"
                    operator: Equals
                    value: false
