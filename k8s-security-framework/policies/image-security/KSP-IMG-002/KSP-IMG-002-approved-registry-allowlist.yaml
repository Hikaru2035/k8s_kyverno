apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: approved-registry-allowlist
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-img-002
  annotations:
    policies.kyverno.io/title: Approved Registry Allowlist
    policies.kyverno.io/category: KSP Image Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Allows project Harbor plus Kubernetes and Kyverno bootstrap registries in the development source policy.
    policies.ksp.io/parameter: Production rendering must replace the complete development allowlist from APPROVED_REGISTRIES; bootstrap registries are not production invariants.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: controlled
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods

  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])

  validations:
  - expression: variables.allContainers.all(container, container.image.startsWith('harbor.example.com/') || container.image.startsWith('registry.k8s.io/') || container.image.startsWith('reg.kyverno.io/'))
    message: Images must come from the approved Harbor, Kubernetes, or Kyverno registry.
