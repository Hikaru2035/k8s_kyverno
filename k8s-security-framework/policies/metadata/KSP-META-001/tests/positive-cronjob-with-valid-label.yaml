apiVersion: batch/v1
kind: CronJob
metadata:
  name: ksp-meta-001-positive-cronjob
  namespace: policy-test
  labels:
    app.kubernetes.io/name: "demo-api"
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: demo-api
              image: harbor.example.com/demo-api:1.0.0
