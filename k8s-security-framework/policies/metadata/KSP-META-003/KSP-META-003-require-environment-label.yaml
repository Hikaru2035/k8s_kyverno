apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-environment-label
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-meta-003
  annotations:
    policies.kyverno.io/title: Require Environment Label
    policies.kyverno.io/category: KSP Metadata
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Workload
    policies.kyverno.io/description: Requires a canonical dev, staging, or production environment label.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: limited
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions:
  - Audit
  - Warn
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
  validations:
  - expression: object.metadata.?labels['policies.ksp.io/environment'].orValue('') in ['dev', 'staging', 'production']
    message: Set metadata.labels.policies.ksp.io/environment to dev, staging, or production.
