apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-namespace-environment-profile
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-meta-003
  annotations:
    policies.kyverno.io/title: Require Namespace Environment and Profile
    policies.kyverno.io/category: KSP Metadata
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: Validates independent environment and security-profile labels on application Namespaces.
    policies.ksp.io/profiles: common
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: none
spec:
  evaluation:
    background:
      enabled: true
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  validationActions: [Audit, Warn]
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [namespaces]
    excludeResourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [namespaces]
      resourceNames: [default, kube-system, kube-public, kube-node-lease, kyverno, calico-system, tigera-operator]
  validations:
  - expression: object.metadata.?labels['ksp.io/environment'].orValue('') in ['dev', 'staging', 'production']
    message: Set ksp.io/environment to dev, staging, or production.
  - expression: object.metadata.?labels['ksp.io/profile'].orValue('') in ['baseline', 'standard', 'restricted']
    message: Set ksp.io/profile to baseline, standard, or restricted.
