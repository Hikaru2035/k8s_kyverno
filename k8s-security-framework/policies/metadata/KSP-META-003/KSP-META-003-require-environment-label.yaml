apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-environment-label
  labels: {app.kubernetes.io/managed-by: kyverno, policies.ksp.io/id: ksp-meta-003}
  annotations:
    policies.kyverno.io/title: Require Environment Label
    policies.kyverno.io/category: KSP Metadata
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Workload
    policies.kyverno.io/description: Requires a canonical dev, staging, or production environment label.
    policies.ksp.io/profiles: standard,restricted
    policies.ksp.io/dev-mode: Audit
    policies.ksp.io/staging-mode: Audit
    policies.ksp.io/prod-mode: Enforce
    policies.ksp.io/exception: limited
spec:
  background: true
  emitWarning: true
  webhookConfiguration: {failurePolicy: Fail, timeoutSeconds: 10}
  rules:
    - name: require-environment-label
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
      validate:
        failureAction: Audit
        allowExistingViolations: true
        message: Set metadata.labels.policies.ksp.io/environment to dev, staging, or production.
        pattern:
          metadata:
            labels:
              policies.ksp.io/environment: dev | staging | production
