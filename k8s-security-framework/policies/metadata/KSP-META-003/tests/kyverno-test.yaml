apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ksp-meta-003-require-environment-label
policies:
  - ../KSP-META-003-require-environment-label.yaml
resources:
  - positive.yaml
  - negative.yaml
  - boundary.yaml
  - exception-resource.yaml
exceptions:
  - exception.yaml
results:
  - policy: require-environment-label
    rule: require-environment-label
    kind: Deployment
    resources:
      - meta-003-positive
    result: pass
  - policy: require-environment-label
    rule: require-environment-label
    kind: Deployment
    resources:
      - meta-003-negative
    result: fail
  - policy: require-environment-label
    rule: require-environment-label
    kind: Job
    resources:
      - meta-003-boundary
    result: pass
  - policy: require-environment-label
    rule: require-environment-label
    kind: Deployment
    resources:
      - ksp-meta-003-exception
    result: skip
