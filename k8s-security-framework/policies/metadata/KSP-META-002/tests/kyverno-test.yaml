    rule: require-owner-label
    kind: Deployment
    resources:
      - meta-002-negative
    result: fail
  - policy: require-owner-label
    rule: require-owner-label
    kind: StatefulSet
    resources:
      - meta-002-boundary
    result: pass
  - policy: require-owner-label
    rule: require-owner-label
    kind: Deployment
    resources:
      - ksp-meta-002-exception
    result: skip
