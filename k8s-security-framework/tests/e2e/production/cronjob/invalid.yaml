apiVersion: batch/v1
kind: CronJob
metadata:
  name: e2e-prod-cronjob-invalid
  namespace: ksp-production
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: e2e-prod-cronjob-invalid
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: nginx:latest
              command: ["sh", "-c", "echo invalid"]
