apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e2e-prod-statefulset-invalid
  namespace: ksp-production
spec:
  serviceName: e2e-prod-statefulset-invalid
  replicas: 1
  selector:
    matchLabels:
      app: e2e-prod-statefulset-invalid
  template:
    metadata:
      labels:
        app: e2e-prod-statefulset-invalid
    spec:
      containers:
        - name: app
          image: nginx:latest
          command: ["sh", "-c", "sleep 3600"]
