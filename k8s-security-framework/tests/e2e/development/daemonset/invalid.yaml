apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: e2e-dev-daemonset-invalid
  namespace: ksp-dev
spec:
  selector:
    matchLabels:
      app: e2e-dev-daemonset-invalid
  template:
    metadata:
      labels:
        app: e2e-dev-daemonset-invalid
    spec:
      containers:
        - name: app
          image: nginx:latest
          command: ["sh", "-c", "sleep 3600"]
