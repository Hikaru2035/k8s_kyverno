apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: e2e-stg-statefulset-valid
  namespace: ksp-staging
  labels:
    app.kubernetes.io/name: e2e-stg-statefulset
    policies.ksp.io/owner: security-team
spec:
  serviceName: e2e-stg-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: e2e-stg-statefulset-valid
  template:
    metadata:
      labels:
        app: e2e-stg-statefulset-valid
    spec:
      imagePullSecrets:
        - name: harbor-registry-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: harbor-public:30003/ksp-test/signed@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          imagePullPolicy: Always
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
