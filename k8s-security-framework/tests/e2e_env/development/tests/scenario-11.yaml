# Scenario 11: pre-policy non-compliant workload for background scan
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-existing-violation
  namespace: e2e-ksp-beta
  labels: {app.kubernetes.io/name: e2e-ksp-existing-violation, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-existing-violation}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-existing-violation}}
    spec:
      containers:
      - name: app
        image: nginx:latest
