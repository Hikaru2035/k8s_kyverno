# Scenario 10: intentional Baseline latest-tag violation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-baseline-violation
  namespace: e2e-ksp-alpha
  labels: {app.kubernetes.io/name: e2e-ksp-baseline-violation, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-baseline-violation}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-baseline-violation}}
    spec:
      containers:
      - name: app
        image: nginx:latest
