# Scenario 14: replicated Deployment and Service availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-ha-app
  namespace: e2e-ksp-canary
  labels: {app.kubernetes.io/name: e2e-ksp-ha-app, policies.ksp.io/owner: e2e}
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-ha-app}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-ha-app}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: e2e-ksp-ha-app, namespace: e2e-ksp-canary}
spec: {selector: {app.kubernetes.io/name: e2e-ksp-ha-app}, ports: [{port: 80, targetPort: 8080}]}
