# Scenario 13: Standard violation and remediation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-standard-remediation
  namespace: e2e-ksp-canary
  labels: {app.kubernetes.io/name: e2e-ksp-standard-remediation, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-standard-remediation}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-standard-remediation}}
    spec:
      containers:
      - name: app
        image: nginx:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-standard-fixed
  namespace: e2e-ksp-canary
  labels: {app.kubernetes.io/name: e2e-ksp-standard-fixed, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-standard-fixed}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-standard-fixed}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
