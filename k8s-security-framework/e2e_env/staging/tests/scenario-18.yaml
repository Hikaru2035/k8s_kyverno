# Scenario 18: Kyverno admission-controller failure/HA evidence
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-ha-admission-check
  namespace: e2e-ksp-canary
  labels: {app.kubernetes.io/name: e2e-ksp-ha-admission-check, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-ha-admission-check}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-ha-admission-check}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-ksp-ha-deny-check
  namespace: e2e-ksp-canary
  labels: {app.kubernetes.io/name: e2e-ksp-ha-deny-check, policies.ksp.io/owner: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: e2e-ksp-ha-deny-check}}
  template:
    metadata: {labels: {app.kubernetes.io/name: e2e-ksp-ha-deny-check}}
    spec:
      containers:
      - name: app
        image: nginx:latest
