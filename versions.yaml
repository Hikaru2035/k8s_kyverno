# versions.yaml
# Single source of truth for component versions used by this project.
#
# Repository version inventory reviewed: 2026-09-13
# Platform entries are declared baselines, not live-cluster verification.
# CI pins are checked against .gitlab-ci.yml by policy-validate.
# null means no application version is recorded in repository configuration.
# Security rule:
# - No "latest" tags.
# - Use stable releases only.
# - Run vulnerability scan before production-candidate release.
# - Re-check versions before final PoC release.

framework:
  name: kyverno-security-framework
  version: "0.1.0"

platform:
  os:
    name: ubuntu-server
    version: "22.04.5"

  kubernetes:
    version: "1.35.7"
    kubeadm: "1.35.7"
    kubelet: "1.35.7"
    kubectl: "1.35.7"

  runtime:
    name: containerd
    version: "2.2.1"

networking:
  cni:
    name: calico
    version: "3.28.0"

package_management:
  helm:
    version: "4.2.3"

policy_engine:
  kyverno:
    version: "1.18.2"
    chart_version: "3.8.2"
  kyverno_cli:
    version: "1.18.2"

image_security:
  harbor:
    version: null # harbor-values.yaml does not pin an application/chart version.
  cosign:
    version: "2.5.3" # Jenkins delivery key-based signing; existing public trust key retained.

monitoring:
  prometheus:
    version: null # Values and ServiceMonitors do not pin an application version.
  grafana:
    version: null # Dashboard pluginVersion 13.2.1 is not a deployment pin.

# Preserve CI's existing toolchain separately from the platform baseline.
ci:
  kind:
    version: "0.32.0"
    node_image: null # kind create cluster uses this Kind release's default.
  helm:
    version: "3.21.4" # CI differs intentionally from platform Helm 4.2.3.
  kubectl:
    version: null
    source: "https://dl.k8s.io/release/stable.txt" # Existing rolling selection; not reproducible.
  python:
    image: "python:3.12.11-slim-bookworm"
  pyyaml:
    version: "6.0.2"
  alpine:
    image: "alpine:3.21.3"
  docker:
    image: "docker:27.5.1-cli"

cluster:
  type: multi-node

  node_network: "192.168.101.0/24"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"

  nodes:
    control_plane:
      hostname: control-plane
      #ip: "192.168.101.80"

    worker_01:
      hostname: worker-node-1
      #ip: "192.168.101.81"

    worker_02:
      hostname: worker-node-2
      #ip: "192.168.101.82"

# Jenkins additions. Existing GitLab/platform pins above remain unchanged.
jenkins:
  chart_version: "5.8.86" # Official chart; controller and default plugin pins come from it.
  agent_image: "jenkins/inbound-agent:3327.v868139a_d00e0-7-jdk21"
  trivy_version: "0.74.0"
  buildkit_version: "0.23.2"
  crane_version: "0.20.3"
  kubectl_version: "1.35.7" # Jenkins uses the declared platform baseline, not stable.txt.
