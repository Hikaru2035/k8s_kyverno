apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hikaru2035/k8s_kyverno.git
    targetRevision: cicd/jenkins
    path: gitops/applications/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: ksp-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
