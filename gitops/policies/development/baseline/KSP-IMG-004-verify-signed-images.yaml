          -----END PUBLIC KEY-----'
  validations:
  - expression: "(\n  images.containers\n  + images.?initContainers.orValue([])\n\
      \  + images.?ephemeralContainers.orValue([])\n).map(\n  image,\n  verifyImageSignatures(image,\
      \ [attestors.cosign])\n).all(result, result > 0)\n"
    message: Image must be signed with the trusted Cosign key.
  matchConditions:
  - name: ksp-runtime-profile-and-platform-scope
