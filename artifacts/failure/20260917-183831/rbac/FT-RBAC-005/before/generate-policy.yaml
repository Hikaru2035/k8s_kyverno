  generation: 1
  labels:
    app.kubernetes.io/managed-by: kyverno
    policies.ksp.io/id: ksp-res-005
  name: generate-resource-quota
  resourceVersion: "32034053"
  uid: f1b5cf0b-126d-4f6b-8652-e638c621683a
spec:
  evaluation:
    generateExisting:
      enabled: true
    skipBackgroundRequests: true
    synchronize:
      enabled: true
  generate:
  - expression: |-
      generator.Apply(
        variables.namespaceName,
        variables.downstream
      )
  matchConditions:
  - expression: |-
      object.metadata.?labels[
        "policies.ksp.io/generate-resource-governance"
      ].orValue("") == "enabled"
    name: opted-in-namespace
  - expression: |-
      object.metadata.?labels[
        "policies.ksp.io/environment"
      ].orValue("") in [
        "dev",
        "staging",
        "production"
      ]
    name: valid-environment
  - expression: |-
      object.metadata.?labels[
        "policies.ksp.io/quota-class"
      ].orValue("") in [
        "small",
        "medium",
        "large"
      ]
    name: valid-quota-class
  - expression: (true) && (!(object.metadata.name in ['default', 'kube-system', 'kube-public',
      'kube-node-lease', 'kyverno', 'calico-system', 'tigera-operator']))
    name: ksp-runtime-profile-and-platform-scope
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
  variables:
  - expression: object.metadata.name
    name: namespaceName
  - expression: object.metadata.labels["policies.ksp.io/environment"]
    name: environment
  - expression: object.metadata.labels["policies.ksp.io/quota-class"]
    name: quotaClass
  - expression: |-
      resource.Get(
        "v1",
        "configmaps",
        "kyverno",
        "ksp-resource-quota-sizing"
      )
    name: quotaConfig
  - expression: string(variables.environment) + "." + string(variables.quotaClass)
    name: quotaKey
  - expression: variables.quotaConfig.data[variables.quotaKey + ".requestsCpu"]
    name: requestsCpu
  - expression: variables.quotaConfig.data[variables.quotaKey + ".requestsMemory"]
    name: requestsMemory
  - expression: variables.quotaConfig.data[variables.quotaKey + ".limitsCpu"]
    name: limitsCpu
  - expression: variables.quotaConfig.data[variables.quotaKey + ".limitsMemory"]
    name: limitsMemory
  - expression: variables.quotaConfig.data[variables.quotaKey + ".pods"]
    name: pods
  - expression: |-
      [
        {
          "apiVersion": dyn("v1"),
          "kind": dyn("ResourceQuota"),

          "metadata": dyn({
            "name": dyn("namespace-resource-quota"),
            "labels": dyn({
              "app.kubernetes.io/managed-by": "kyverno",
              "policies.ksp.io/generated-by": "ksp-res-005",
              "policies.ksp.io/environment": string(variables.environment),
              "policies.ksp.io/quota-class": string(variables.quotaClass)
            })
          }),

