apiVersion: v1
kind: Service
metadata:
  name: monitoring-grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: grafana
      nodePort: 30300
      protocol: TCP
