apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-admission-latency
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: kyverno.admission-latency
      rules:
        - alert: KyvernoAdmissionLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(kyverno_admission_review_duration_seconds_bucket[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            component: kyverno
          annotations:
            summary: "Kyverno admission latency is high"
            description: "Kyverno admission p95 latency has exceeded 0.5 seconds for more than 5 minutes."
